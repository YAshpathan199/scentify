<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 500" width="400" height="500">
  <defs>
    <!-- Clear glass -->
    <linearGradient id="dc-glass" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#8080a0" stop-opacity="0.22"/>
      <stop offset="30%" stop-color="#b0b0d0" stop-opacity="0.13"/>
      <stop offset="68%" stop-color="#8080a0" stop-opacity="0.17"/>
      <stop offset="100%" stop-color="#606080" stop-opacity="0.26"/>
    </linearGradient>
    <!-- Bright blue liquid -->
    <linearGradient id="dc-liquid" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2080e0"/>
      <stop offset="50%" stop-color="#1060c0"/>
      <stop offset="100%" stop-color="#0040a0"/>
    </linearGradient>
    <!-- Flat tall-rectangle black cap -->
    <linearGradient id="dc-cap" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2a2a2a"/>
      <stop offset="100%" stop-color="#080808"/>
    </linearGradient>
    <linearGradient id="dc-hl" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#80b8ff" stop-opacity="0.42"/>
      <stop offset="100%" stop-color="#80b8ff" stop-opacity="0"/>
    </linearGradient>
    <filter id="dc-sh"><feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#001850" flood-opacity="0.35"/></filter>
  </defs>
  <g filter="url(#dc-sh)">
    <!-- Body 50ml rectangle, x:152-248, y:158-428 -->
    <rect x="152" y="158" width="96" height="270" rx="3" fill="url(#dc-glass)" stroke="#6080b0" stroke-width="0.8"/>
    <clipPath id="dc-cl"><rect x="155" y="161" width="90" height="264" rx="2"/></clipPath>
    <rect x="155" y="171" width="90" height="254" fill="url(#dc-liquid)" clip-path="url(#dc-cl)" opacity="0.78"/>
    <!-- Glass edge highlight -->
    <rect x="154" y="161" width="18" height="264" fill="url(#dc-hl)" opacity="0.5"/>
    <rect x="157" y="185" width="4" height="110" rx="2" fill="#b8d8ff" opacity="0.22"/>
    <!-- Big white HIRA text on glass -->
    <text x="200" y="253" font-family="'Arial Black','Arial',sans-serif" font-size="22" font-weight="900" fill="#ffffff" text-anchor="middle" letter-spacing="4" opacity="0.82">HIRA</text>
    <!-- Product name below -->
    <text x="200" y="274" font-family="Arial,sans-serif" font-size="8" fill="#d0e8ff" text-anchor="middle" letter-spacing="3" opacity="0.65">DIVE CLUB</text>
    <line x1="166" y1="283" x2="234" y2="283" stroke="#d0e8ff" stroke-width="0.5" opacity="0.4"/>
    <!-- Base -->
    <rect x="150" y="424" width="100" height="4" rx="2" fill="#001840" opacity="0.4"/>
    <!-- Neck -->
    <rect x="176" y="140" width="48" height="20" rx="2" fill="url(#dc-glass)" stroke="#6080b0" stroke-width="0.7"/>
    <!-- Flat tall-rectangle black cap -->
    <rect x="156" y="78" width="88" height="64" rx="2" fill="url(#dc-cap)"/>
    <rect x="156" y="78" width="88" height="6" rx="2" fill="#323232"/>
    <rect x="156" y="136" width="88" height="6" rx="1" fill="#101010"/>
    <rect x="159" y="84" width="8" height="52" rx="1" fill="#ffffff" opacity="0.05"/>
    <ellipse cx="200" cy="434" rx="52" ry="4" fill="#001840" opacity="0.1"/>
  </g>
</svg>
