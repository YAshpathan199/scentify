<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 500" fill="none">
  <defs>
    <linearGradient id="glassGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#c8e8f4" stop-opacity="0.65"/>
      <stop offset="45%" stop-color="#a8d5ec" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#8ac4e0" stop-opacity="0.55"/>
    </linearGradient>
    <linearGradient id="liquidGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#38b2d4" stop-opacity="0.75"/>
      <stop offset="30%" stop-color="#1e96bc"/>
      <stop offset="65%" stop-color="#1278a0"/>
      <stop offset="100%" stop-color="#0a5c82"/>
    </linearGradient>
    <linearGradient id="waveGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#5cd4f0" stop-opacity="0.45"/>
      <stop offset="50%" stop-color="#38b2d4" stop-opacity="0.1"/>
      <stop offset="100%" stop-color="#5cd4f0" stop-opacity="0.45"/>
    </linearGradient>
    <linearGradient id="highlightGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="capGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#e8e8ea"/>
      <stop offset="30%" stop-color="#b8b8c0"/>
      <stop offset="55%" stop-color="#d4d4d8"/>
      <stop offset="80%" stop-color="#a0a0a8"/>
      <stop offset="100%" stop-color="#b8b8c0"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-5%" width="120%" height="115%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="8" result="blur"/>
      <feOffset in="blur" dx="0" dy="6" result="offsetBlur"/>
      <feFlood flood-color="#000000" flood-opacity="0.14" result="color"/>
      <feComposite in="color" in2="offsetBlur" operator="in" result="shadow"/>
      <feMerge>
        <feMergeNode in="shadow"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <radialGradient id="reflectionGrad" cx="0.3" cy="0.32" r="0.5">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.38"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <ellipse cx="200" cy="460" rx="78" ry="11" fill="#000" opacity="0.1"/>

  <g filter="url(#shadow)">
    <!-- Wider, slightly rounded bottle body for Dive Club -->
    <path d="
      M 132 155
      Q 126 168 124 198
      L 122 418
      Q 122 442 142 442
      L 258 442
      Q 278 442 278 418
      L 276 198
      Q 274 168 268 155
      Z
    " fill="url(#glassGrad)" stroke="#b0d8ea" stroke-width="1"/>

    <!-- Liquid fill -->
    <path d="
      M 125 215
      Q 150 208 200 220
      Q 250 232 275 215
      L 277 418
      Q 277 440 258 440
      L 142 440
      Q 123 440 123 418
      Z
    " fill="url(#liquidGrad)"/>

    <!-- Wave accent 1 -->
    <path d="
      M 126 275
      Q 155 263 200 274
      Q 245 285 274 275
      L 274 294
      Q 245 305 200 294
      Q 155 283 126 294
      Z
    " fill="url(#waveGrad)"/>

    <!-- Wave accent 2 -->
    <path d="
      M 126 338
      Q 158 328 200 338
      Q 242 348 274 338
      L 274 353
      Q 242 363 200 353
      Q 158 343 126 353
      Z
    " fill="url(#waveGrad)"/>

    <!-- Glass highlight -->
    <path d="
      M 140 165
      Q 138 198 137 298
      L 150 298
      Q 151 198 153 165
      Z
    " fill="url(#highlightGrad)"/>

    <!-- Reflection -->
    <ellipse cx="160" cy="295" rx="17" ry="78" fill="url(#reflectionGrad)" transform="rotate(-3 160 295)"/>

    <!-- Bottle neck - slightly wider -->
    <path d="
      M 166 108
      L 166 155
      L 234 155
      L 234 108
      Q 232 102 228 102
      L 172 102
      Q 168 102 166 108
      Z
    " fill="url(#glassGrad)" stroke="#b0d8ea" stroke-width="1"/>

    <!-- Neck highlight -->
    <rect x="171" y="112" width="6" height="40" rx="3" fill="#ffffff" opacity="0.28"/>

    <!-- Modern silver cap with rounded top -->
    <path d="
      M 158 62
      Q 158 55 168 55
      L 232 55
      Q 242 55 242 62
      L 242 102
      L 158 102
      Z
    " fill="url(#capGrad)" stroke="#a8a8b2" stroke-width="0.8"/>
    <!-- Cap ridge line -->
    <rect x="158" y="82" width="84" height="2" rx="1" fill="#c0c0c8" opacity="0.6"/>
    <!-- Cap highlight -->
    <rect x="164" y="59" width="5" height="40" rx="2.5" fill="#ffffff" opacity="0.3"/>
    <!-- Cap top flat -->
    <rect x="158" y="55" width="84" height="4" rx="2" fill="#d0d0d8"/>
  </g>
</svg>
