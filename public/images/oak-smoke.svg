<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 500" width="400" height="500">
  <defs>
    <linearGradient id="os-glass" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#808080" stop-opacity="0.22"/>
      <stop offset="30%" stop-color="#b0b0b0" stop-opacity="0.12"/>
      <stop offset="68%" stop-color="#808080" stop-opacity="0.17"/>
      <stop offset="100%" stop-color="#606060" stop-opacity="0.26"/>
    </linearGradient>
    <!-- Dark smoky brown/near-black liquid -->
    <linearGradient id="os-liquid" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#281408"/>
      <stop offset="50%" stop-color="#180a04"/>
      <stop offset="100%" stop-color="#080400"/>
    </linearGradient>
    <linearGradient id="os-cap" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2a2a2a"/>
      <stop offset="100%" stop-color="#080808"/>
    </linearGradient>
    <linearGradient id="os-hl" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#907060" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#907060" stop-opacity="0"/>
    </linearGradient>
    <filter id="os-sh"><feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#080400" flood-opacity="0.5"/></filter>
  </defs>
  <g filter="url(#os-sh)">
    <!-- Same Hira bottle shape as dive-club but near-black liquid -->
    <rect x="152" y="158" width="96" height="270" rx="3" fill="url(#os-glass)" stroke="#606060" stroke-width="0.8"/>
    <clipPath id="os-cl"><rect x="155" y="161" width="90" height="264" rx="2"/></clipPath>
    <rect x="155" y="171" width="90" height="254" fill="url(#os-liquid)" clip-path="url(#os-cl)" opacity="0.90"/>
    <rect x="154" y="161" width="18" height="264" fill="url(#os-hl)" opacity="0.45"/>
    <rect x="157" y="185" width="4" height="110" rx="2" fill="#c0a080" opacity="0.10"/>
    <!-- Big white HIRA text -->
    <text x="200" y="253" font-family="'Arial Black','Arial',sans-serif" font-size="22" font-weight="900" fill="#ffffff" text-anchor="middle" letter-spacing="4" opacity="0.75">HIRA</text>
    <text x="200" y="274" font-family="Arial,sans-serif" font-size="8" fill="#d0c8b8" text-anchor="middle" letter-spacing="3" opacity="0.60">OAK &amp; SMOKE</text>
    <line x1="166" y1="283" x2="234" y2="283" stroke="#d0c8b8" stroke-width="0.5" opacity="0.35"/>
    <rect x="150" y="424" width="100" height="4" rx="2" fill="#080400" opacity="0.5"/>
    <rect x="176" y="140" width="48" height="20" rx="2" fill="url(#os-glass)" stroke="#606060" stroke-width="0.7"/>
    <rect x="156" y="78" width="88" height="64" rx="2" fill="url(#os-cap)"/>
    <rect x="156" y="78" width="88" height="6" rx="2" fill="#323232"/>
    <rect x="156" y="136" width="88" height="6" rx="1" fill="#101010"/>
    <rect x="159" y="84" width="8" height="52" rx="1" fill="#ffffff" opacity="0.04"/>
    <ellipse cx="200" cy="434" rx="52" ry="4" fill="#080400" opacity="0.1"/>
  </g>
</svg>
