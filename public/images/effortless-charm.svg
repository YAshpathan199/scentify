<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 500" width="400" height="500">
  <defs>
    <linearGradient id="ec-glass" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#a8a8a0" stop-opacity="0.20"/>
      <stop offset="30%" stop-color="#d0d0c8" stop-opacity="0.11"/>
      <stop offset="68%" stop-color="#a8a8a0" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#888880" stop-opacity="0.24"/>
    </linearGradient>
    <linearGradient id="ec-liquid" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f8f8f0" stop-opacity="0.30"/>
      <stop offset="100%" stop-color="#f0edd8" stop-opacity="0.25"/>
    </linearGradient>
    <linearGradient id="ec-cap" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f0d060"/>
      <stop offset="45%" stop-color="#c89830"/>
      <stop offset="100%" stop-color="#806010"/>
    </linearGradient>
    <linearGradient id="ec-hl" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <!-- Green hills label -->
    <linearGradient id="ec-sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#081808"/>
      <stop offset="100%" stop-color="#102010"/>
    </linearGradient>
    <filter id="ec-sh"><feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#303030" flood-opacity="0.22"/></filter>
  </defs>
  <g filter="url(#ec-sh)">
    <path d="M176,180 Q152,180 152,204 L152,425 Q152,428 155,428 L245,428 Q248,428 248,425 L248,204 Q248,180 224,180 Q218,160 200,156 Q182,160 176,180 Z" fill="url(#ec-glass)" stroke="#b0b0a8" stroke-width="0.8"/>
    <clipPath id="ec-cl">
      <path d="M155,205 L155,424 L245,424 L245,205 Q245,183 224,183 Q218,163 200,159 Q182,163 176,183 Z"/>
    </clipPath>
    <rect x="156" y="182" width="88" height="244" fill="url(#ec-liquid)" clip-path="url(#ec-cl)"/>
    <path d="M176,180 Q152,180 152,204 L152,425" fill="none" stroke="url(#ec-hl)" stroke-width="18" opacity="0.42"/>
    <rect x="155" y="210" width="4" height="130" rx="2" fill="#ffffff" opacity="0.22"/>
    <!-- Label: peacock + green hills -->
    <rect x="156" y="262" width="88" height="100" rx="1" fill="url(#ec-sky)" opacity="0.90"/>
    <!-- Green hills -->
    <ellipse cx="180" cy="358" rx="34" ry="18" fill="#143810" opacity="0.85"/>
    <ellipse cx="215" cy="354" rx="38" ry="16" fill="#1c5018" opacity="0.80"/>
    <!-- Peacock body (simple stylized bird) -->
    <ellipse cx="200" cy="316" rx="8" ry="10" fill="#08483c" opacity="0.90"/>
    <ellipse cx="200" cy="308" rx="4" ry="5" fill="#0a5848" opacity="0.90"/>
    <!-- Peacock tail feathers (fan) -->
    <path d="M192,316 Q178,298 174,284 Q185,292 192,308 Z" fill="#104030" opacity="0.70"/>
    <path d="M196,314 Q186,294 188,278 Q196,290 198,312 Z" fill="#186848" opacity="0.75"/>
    <path d="M200,312 Q200,286 200,272 Q204,286 200,312 Z" fill="#104030" opacity="0.70"/>
    <path d="M204,314 Q214,294 212,278 Q204,290 202,312 Z" fill="#186848" opacity="0.75"/>
    <path d="M208,316 Q222,298 226,284 Q215,292 208,308 Z" fill="#104030" opacity="0.70"/>
    <!-- Feather eye dots -->
    <circle cx="174" cy="284" r="2.5" fill="#40c060" opacity="0.60"/>
    <circle cx="188" cy="278" r="2.5" fill="#40c060" opacity="0.60"/>
    <circle cx="200" cy="272" r="2.5" fill="#40c060" opacity="0.60"/>
    <circle cx="212" cy="278" r="2.5" fill="#40c060" opacity="0.60"/>
    <circle cx="226" cy="284" r="2.5" fill="#40c060" opacity="0.60"/>
    <!-- Label text -->
    <text x="200" y="345" font-family="Georgia,serif" font-size="8.5" fill="#a0d870" text-anchor="middle" letter-spacing="0.3" opacity="0.88">Effortless Charm</text>
    <text x="200" y="357" font-family="Arial,sans-serif" font-size="5.5" fill="#78a850" text-anchor="middle" letter-spacing="2.5" opacity="0.75">ARTISCENTS</text>
    <rect x="150" y="424" width="100" height="4" rx="2" fill="#484840" opacity="0.35"/>
    <rect x="174" y="136" width="52" height="26" rx="4" fill="url(#ec-glass)" stroke="#b0b0a8" stroke-width="0.7"/>
    <rect x="171" y="78" width="58" height="62" rx="4" fill="url(#ec-cap)"/>
    <line x1="180" y1="80" x2="180" y2="138" stroke="#c89020" stroke-width="0.5" opacity="0.5"/>
    <line x1="188" y1="80" x2="188" y2="138" stroke="#c89020" stroke-width="0.5" opacity="0.5"/>
    <line x1="196" y1="80" x2="196" y2="138" stroke="#c89020" stroke-width="0.5" opacity="0.5"/>
    <line x1="204" y1="80" x2="204" y2="138" stroke="#c89020" stroke-width="0.5" opacity="0.5"/>
    <line x1="212" y1="80" x2="212" y2="138" stroke="#c89020" stroke-width="0.5" opacity="0.5"/>
    <line x1="220" y1="80" x2="220" y2="138" stroke="#c89020" stroke-width="0.5" opacity="0.5"/>
    <ellipse cx="200" cy="78" rx="29" ry="9" fill="#f0d868"/>
    <ellipse cx="190" cy="75" rx="11" ry="4" fill="#ffffff" opacity="0.22"/>
