<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 500" width="400" height="500">
  <defs>
    <!-- Dark brown to amber gradient glass -->
    <linearGradient id="or-glass" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#2a1008" stop-opacity="0.97"/>
      <stop offset="30%" stop-color="#4a2010" stop-opacity="0.85"/>
      <stop offset="68%" stop-color="#341408" stop-opacity="0.92"/>
      <stop offset="100%" stop-color="#200a04" stop-opacity="0.98"/>
    </linearGradient>
    <linearGradient id="or-glass-vert" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7a3818" stop-opacity="0.90"/>
      <stop offset="50%" stop-color="#4a2010" stop-opacity="0.90"/>
      <stop offset="100%" stop-color="#2a1008" stop-opacity="0.97"/>
    </linearGradient>
    <linearGradient id="or-liquid" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#5a2808"/>
      <stop offset="50%" stop-color="#381508"/>
      <stop offset="100%" stop-color="#200800"/>
    </linearGradient>
    <!-- Gold dome cap -->
    <radialGradient id="or-cap-dome" cx="40%" cy="30%" r="65%">
      <stop offset="0%" stop-color="#f0d060"/>
      <stop offset="45%" stop-color="#c89830"/>
      <stop offset="100%" stop-color="#806010"/>
    </radialGradient>
    <linearGradient id="or-hl" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#c08060" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#c08060" stop-opacity="0"/>
    </linearGradient>
    <filter id="or-sh"><feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#180600" flood-opacity="0.5"/></filter>
  </defs>
  <g filter="url(#or-sh)">
    <!-- Same tapered shape, dark brown -->
    <path d="M172,220 Q164,220 164,230 L164,415 Q164,418 167,418 L233,418 Q236,418 236,415 L236,230 Q236,220 228,220 Q220,194 200,190 Q180,194 172,220 Z" fill="url(#or-glass)" stroke="#4a1a08" stroke-width="0.8"/>
    <clipPath id="or-cl">
      <path d="M166,222 Q166,224 166,230 L166,414 L234,414 L234,230 Q234,224 234,222 Q220,196 200,192 Q180,196 166,222 Z"/>
    </clipPath>
    <rect x="167" y="200" width="66" height="216" fill="url(#or-liquid)" clip-path="url(#or-cl)" opacity="0.88"/>
    <path d="M172,220 Q164,220 164,230 L164,415" fill="none" stroke="url(#or-hl)" stroke-width="14" opacity="0.4"/>
    <text x="200" y="312" font-family="Georgia,serif" font-size="8" fill="#c07840" text-anchor="middle" letter-spacing="0.5" opacity="0.75">Oud on the Rocks</text>
    <text x="200" y="327" font-family="Arial,sans-serif" font-size="6" fill="#a06030" text-anchor="middle" letter-spacing="2" opacity="0.6">AJMAL</text>
    <!-- Neck -->
    <rect x="183" y="168" width="34" height="24" rx="2" fill="url(#or-glass)" stroke="#4a1a08" stroke-width="0.7"/>
    <!-- Gold ribbed dome cap -->
    <ellipse cx="200" cy="150" rx="30" ry="22" fill="url(#or-cap-dome)" stroke="#c09020" stroke-width="0.8"/>
    <line x1="184" y1="138" x2="184" y2="171" stroke="#a07820" stroke-width="0.6" opacity="0.5"/>
    <line x1="191" y1="132" x2="191" y2="171" stroke="#a07820" stroke-width="0.6" opacity="0.5"/>
    <line x1="200" y1="130" x2="200" y2="171" stroke="#a07820" stroke-width="0.6" opacity="0.5"/>
    <line x1="209" y1="132" x2="209" y2="171" stroke="#a07820" stroke-width="0.6" opacity="0.5"/>
    <line x1="216" y1="138" x2="216" y2="171" stroke="#a07820" stroke-width="0.6" opacity="0.5"/>
    <ellipse cx="192" cy="143" rx="10" ry="7" fill="#f8e890" opacity="0.25"/>
    <rect x="162" y="413" width="76" height="5" rx="2" fill="#180600" opacity="0.4"/>
    <ellipse cx="200" cy="427" rx="42" ry="4" fill="#180600" opacity="0.1"/>
  </g>
</svg>
