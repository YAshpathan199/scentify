<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 500" width="400" height="500">
  <defs>
    <!-- Faceted glass gradient -->
    <linearGradient id="or-glass" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#4a4a4a" stop-opacity="0.6"/>
      <stop offset="50%" stop-color="#2a2a2a" stop-opacity="0.7"/>
      <stop offset="100%" stop-color="#1a1a1a" stop-opacity="0.8"/>
    </linearGradient>
    <!-- Dark liquid -->
    <linearGradient id="or-liquid" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#5c3a1e"/>
      <stop offset="40%" stop-color="#3a2010"/>
      <stop offset="100%" stop-color="#1a0a00"/>
    </linearGradient>
    <!-- Left facet highlight -->
    <linearGradient id="or-facet-left" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <!-- Right facet -->
    <linearGradient id="or-facet-right" x1="1" y1="0" x2="0" y2="0">
      <stop offset="0%" stop-color="#000000" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </linearGradient>
    <!-- Cap gradient -->
    <linearGradient id="or-cap" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#3a3a3a"/>
      <stop offset="100%" stop-color="#1a1a1a"/>
    </linearGradient>
    <!-- Edge highlight -->
    <linearGradient id="or-edge" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.3"/>
      <stop offset="50%" stop-color="#ffffff" stop-opacity="0.1"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <!-- Shadow -->
    <filter id="or-shadow" x="-20%" y="-10%" width="140%" height="130%">
      <feDropShadow dx="0" dy="10" stdDeviation="15" flood-color="#000000" flood-opacity="0.3"/>
    </filter>
  </defs>

  <g filter="url(#or-shadow)">
    <!-- Main bottle body - angular/faceted crystal rock shape -->
    <path d="M130,180 L110,380 L140,420 L260,420 L290,380 L270,180 Z" fill="url(#or-glass)" stroke="#555555" stroke-width="0.8"/>

    <!-- Liquid fill -->
    <clipPath id="or-clip">
      <path d="M132,185 L112,378 L141,418 L259,418 L288,378 L268,185 Z"/>
    </clipPath>
    <rect x="112" y="220" width="180" height="200" fill="url(#or-liquid)" clip-path="url(#or-clip)" opacity="0.85"/>

    <!-- Facet lines - diagonal cuts like crystal -->
    <line x1="170" y1="180" x2="155" y2="420" stroke="#666666" stroke-width="0.5" opacity="0.4"/>
    <line x1="230" y1="180" x2="245" y2="420" stroke="#666666" stroke-width="0.5" opacity="0.4"/>
    <line x1="200" y1="180" x2="200" y2="420" stroke="#666666" stroke-width="0.3" opacity="0.3"/>

    <!-- Left facet highlight panel -->
    <path d="M130,180 L110,380 L140,420 L155,420 L170,180 Z" fill="url(#or-facet-left)"/>

    <!-- Right facet shadow panel -->
    <path d="M245,420 L260,420 L290,380 L270,180 L230,180 Z" fill="url(#or-facet-right)"/>

    <!-- Sharp edge highlight on left -->
    <line x1="130" y1="182" x2="112" y2="378" stroke="#ffffff" stroke-width="1" opacity="0.2"/>

    <!-- Top edge highlight -->
    <line x1="132" y1="180" x2="268" y2="180" stroke="#ffffff" stroke-width="0.8" opacity="0.15"/>

    <!-- Liquid surface line -->
    <line x1="135" y1="230" x2="265" y2="230" stroke="#7a5030" stroke-width="0.8" opacity="0.4"/>

    <!-- Neck - short angular -->
    <path d="M175,150 L175,180 L225,180 L225,150 Z" fill="url(#or-glass)" stroke="#555555" stroke-width="0.8"/>

    <!-- Neck edge highlight -->
    <rect x="175" y="150" width="3" height="30" fill="url(#or-edge)" opacity="0.5"/>

    <!-- Cap - matte black squared off -->
    <rect x="168" y="110" width="64" height="42" rx="3" fill="url(#or-cap)" stroke="#444444" stroke-width="0.5"/>

    <!-- Cap top surface -->
    <rect x="168" y="110" width="64" height="8" rx="3" fill="#444444"/>

    <!-- Cap subtle texture lines -->
    <line x1="175" y1="118" x2="175" y2="150" stroke="#333333" stroke-width="0.5" opacity="0.5"/>
    <line x1="225" y1="118" x2="225" y2="150" stroke="#333333" stroke-width="0.5" opacity="0.5"/>

    <!-- Cap highlight -->
    <rect x="172" y="115" width="20" height="2" rx="1" fill="#ffffff" opacity="0.1"/>

    <!-- Bottom base edge -->
    <line x1="140" y1="420" x2="260" y2="420" stroke="#666666" stroke-width="1" opacity="0.5"/>

    <!-- Ground reflection -->
    <ellipse cx="200" cy="430" rx="80" ry="6" fill="#1a1a1a" opacity="0.2"/>
  </g>
</svg>