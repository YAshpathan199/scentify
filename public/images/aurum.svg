<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 200" fill="none">
  <defs>
    <linearGradient id="bottleGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#F9C5D1"/>
      <stop offset="50%" stop-color="#E8958A"/>
      <stop offset="100%" stop-color="#C4607A"/>
    </linearGradient>
    <linearGradient id="capGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#D4AF37"/>
      <stop offset="100%" stop-color="#A07820"/>
    </linearGradient>
    <linearGradient id="shine" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="white" stop-opacity="0.35"/>
      <stop offset="50%" stop-color="white" stop-opacity="0.1"/>
      <stop offset="100%" stop-color="white" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <!-- Cap -->
  <rect x="42" y="12" width="36" height="20" rx="4" fill="url(#capGrad)"/>
  <rect x="48" y="8" width="24" height="8" rx="3" fill="#C49A28"/>
  <!-- Neck -->
  <rect x="50" y="32" width="20" height="18" rx="2" fill="#D4906C"/>
  <!-- Body -->
  <rect x="22" y="50" width="76" height="118" rx="14" fill="url(#bottleGrad)"/>
  <!-- Shine -->
  <rect x="22" y="50" width="76" height="118" rx="14" fill="url(#shine)"/>
  <!-- Label area -->
  <rect x="30" y="80" width="60" height="56" rx="6" fill="white" fill-opacity="0.22"/>
  <!-- Label text lines -->
  <rect x="38" y="92" width="44" height="4" rx="2" fill="white" fill-opacity="0.7"/>
  <rect x="42" y="102" width="36" height="3" rx="1.5" fill="white" fill-opacity="0.5"/>
  <rect x="38" y="113" width="44" height="3" rx="1.5" fill="white" fill-opacity="0.4"/>
  <!-- Floral accent -->
  <circle cx="60" cy="124" r="6" fill="white" fill-opacity="0.18"/>
  <circle cx="60" cy="124" r="3" fill="white" fill-opacity="0.3"/>
</svg>
