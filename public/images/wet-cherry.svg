<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 500" width="400" height="500">
  <defs>
    <linearGradient id="wc-glass" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#a8a8a0" stop-opacity="0.22"/>
      <stop offset="30%" stop-color="#d0d0c8" stop-opacity="0.13"/>
      <stop offset="68%" stop-color="#a8a8a0" stop-opacity="0.17"/>
      <stop offset="100%" stop-color="#888880" stop-opacity="0.26"/>
    </linearGradient>
    <!-- Pale amber-peach liquid -->
    <linearGradient id="wc-liquid" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f0a870" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#d88050" stop-opacity="0.42"/>
    </linearGradient>
    <linearGradient id="wc-cap" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f0d060"/>
      <stop offset="45%" stop-color="#c89830"/>
      <stop offset="100%" stop-color="#806010"/>
    </linearGradient>
    <linearGradient id="wc-hl" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <!-- Landscape label: red hills + tree -->
    <linearGradient id="wc-sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#200810"/>
      <stop offset="100%" stop-color="#380e14"/>
    </linearGradient>
    <filter id="wc-sh"><feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#303030" flood-opacity="0.22"/></filter>
  </defs>
  <g filter="url(#wc-sh)">
    <path d="M176,180 Q152,180 152,204 L152,425 Q152,428 155,428 L245,428 Q248,428 248,425 L248,204 Q248,180 224,180 Q218,160 200,156 Q182,160 176,180 Z" fill="url(#wc-glass)" stroke="#b0b0a8" stroke-width="0.8"/>
    <clipPath id="wc-cl">
      <path d="M155,205 L155,424 L245,424 L245,205 Q245,183 224,183 Q218,163 200,159 Q182,163 176,183 Z"/>
    </clipPath>
    <rect x="156" y="182" width="88" height="244" fill="url(#wc-liquid)" clip-path="url(#wc-cl)"/>
    <path d="M176,180 Q152,180 152,204 L152,425" fill="none" stroke="url(#wc-hl)" stroke-width="18" opacity="0.42"/>
    <rect x="155" y="210" width="4" height="130" rx="2" fill="#ffffff" opacity="0.22"/>
    <!-- Label: red landscape -->
    <rect x="156" y="262" width="88" height="100" rx="1" fill="url(#wc-sky)" opacity="0.90"/>
    <!-- Rolling red hills -->
    <ellipse cx="175" cy="348" rx="30" ry="18" fill="#8c1820" opacity="0.85"/>
    <ellipse cx="210" cy="354" rx="35" ry="16" fill="#6a1218" opacity="0.85"/>
    <ellipse cx="240" cy="350" rx="20" ry="14" fill="#8c1820" opacity="0.85"/>
    <!-- Simple tree silhouette (center) -->
    <rect x="198" y="310" width="4" height="28" fill="#1a0608" opacity="0.80"/>
    <ellipse cx="200" cy="306" rx="10" ry="12" fill="#1a0608" opacity="0.75"/>
    <!-- Moon/circle -->
    <circle cx="228" cy="275" r="7" fill="#f0d8a0" opacity="0.55"/>
    <!-- Label text -->
    <text x="200" y="345" font-family="Georgia,serif" font-size="10" fill="#f0d060" text-anchor="middle" letter-spacing="0.5" opacity="0.90">Wet Cherry</text>
    <text x="200" y="357" font-family="Arial,sans-serif" font-size="5.5" fill="#c0a040" text-anchor="middle" letter-spacing="2.5" opacity="0.75">ARTISCENTS</text>
    <rect x="150" y="424" width="100" height="4" rx="2" fill="#484840" opacity="0.35"/>
    <rect x="174" y="136" width="52" height="26" rx="4" fill="url(#wc-glass)" stroke="#b0b0a8" stroke-width="0.7"/>
    <rect x="171" y="78" width="58" height="62" rx="4" fill="url(#wc-cap)"/>
    <line x1="180" y1="80" x2="180" y2="138" stroke="#c89020" stroke-width="0.5" opacity="0.5"/>
    <line x1="188" y1="80" x2="188" y2="138" stroke="#c89020" stroke-width="0.5" opacity="0.5"/>
    <line x1="196" y1="80" x2="196" y2="138" stroke="#c89020" stroke-width="0.5" opacity="0.5"/>
    <line x1="204" y1="80" x2="204" y2="138" stroke="#c89020" stroke-width="0.5" opacity="0.5"/>
    <line x1="212" y1="80" x2="212" y2="138" stroke="#c89020" stroke-width="0.5" opacity="0.5"/>
    <line x1="220" y1="80" x2="220" y2="138" stroke="#c89020" stroke-width="0.5" opacity="0.5"/>
    <ellipse cx="200" cy="78" rx="29" ry="9" fill="#f0d868"/>
    <ellipse cx="190" cy="75" rx="11" ry="4" fill="#ffffff" opacity="0.22"/>
    <rect x="171" y="134" width="58" height="6" rx="2" fill="#a07818"/>
    <rect x="175" y="82" width="6" height="54" rx="3" fill="#ffffff" opacity="0.18"/>
    <ellipse cx="200" cy="434" rx="52" ry="4" fill="#303030" opacity="0.1"/>
  </g>
</svg>
