<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 500" width="400" height="500">
  <defs>
    <linearGradient id="atl-glass" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#2060b0" stop-opacity="0.28"/>
      <stop offset="35%" stop-color="#4090d8" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#1040a0" stop-opacity="0.32"/>
    </linearGradient>
    <linearGradient id="atl-liquid" x1="0" y1="0" x2="0.3" y2="1">
      <stop offset="0%" stop-color="#80d0f8"/>
      <stop offset="25%" stop-color="#40a8e8"/>
      <stop offset="55%" stop-color="#2070c0"/>
      <stop offset="80%" stop-color="#184898"/>
      <stop offset="100%" stop-color="#0c2860"/>
    </linearGradient>
    <linearGradient id="atl-glow" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#a8f0ff" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#40a8e8" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="atl-cap" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e8f4ff"/>
      <stop offset="40%" stop-color="#b0d0f0"/>
      <stop offset="100%" stop-color="#6090c0"/>
    </linearGradient>
    <linearGradient id="atl-accent" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#80c8f0"/>
      <stop offset="100%" stop-color="#3070b8"/>
    </linearGradient>
    <linearGradient id="atl-hl" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <filter id="atl-shadow">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#2060c0" flood-opacity="0.22"/>
    </filter>
  </defs>

  <g filter="url(#atl-shadow)">
    <!-- Wider body for 100ml -->
    <rect x="140" y="145" width="120" height="285" rx="8" fill="url(#atl-glass)" stroke="#3078c8" stroke-width="0.8"/>

    <clipPath id="atl-clip">
      <rect x="143" y="148" width="114" height="279" rx="6"/>
    </clipPath>
    <rect x="143" y="162" width="114" height="265" fill="url(#atl-liquid)" clip-path="url(#atl-clip)" opacity="0.88"/>

    <!-- Mint/arctic glow -->
    <ellipse cx="175" cy="210" rx="25" ry="40" fill="url(#atl-glow)" clip-path="url(#atl-clip)" opacity="0.4"/>
    <ellipse cx="230" cy="310" rx="18" ry="28" fill="#a8f0ff" fill-opacity="0.07" clip-path="url(#atl-clip)"/>

    <!-- Liquid streaks -->
    <line x1="158" y1="195" x2="160" y2="425" stroke="#80d0f8" stroke-width="0.6" opacity="0.18"/>
    <line x1="195" y1="185" x2="193" y2="430" stroke="#a8f0ff" stroke-width="0.4" opacity="0.12"/>
    <line x1="235" y1="200" x2="238" y2="420" stroke="#80d0f8" stroke-width="0.5" opacity="0.15"/>

    <!-- Left edge highlight -->
    <rect x="142" y="148" width="20" height="279" fill="url(#atl-hl)" opacity="0.55"/>
    <rect x="145" y="175" width="5" height="95" rx="2.5" fill="#ffffff" opacity="0.22"/>

    <!-- Accent lines -->
    <rect x="140" y="412" width="120" height="2.5" fill="url(#atl-accent)" opacity="0.75"/>
    <rect x="140" y="148" width="120" height="2.5" fill="url(#atl-accent)" opacity="0.55"/>

    <!-- Neck -->
    <path d="M172,122 L172,148 L228,148 L228,122 Q228,118 220,116 L180,116 Q172,118 172,122 Z" fill="url(#atl-glass)" stroke="#3078c8" stroke-width="0.8"/>
    <rect x="170" y="134" width="60" height="3" fill="url(#atl-accent)" opacity="0.85"/>

    <!-- Sprayer -->
    <rect x="192" y="108" width="16" height="12" rx="2" fill="#90b8e0"/>
    <rect x="195" y="102" width="10" height="8" rx="1" fill="#a0c8f0"/>

    <!-- Cap -->
    <rect x="145" y="38" width="110" height="82" rx="7" fill="url(#atl-cap)" stroke="#90b8d8" stroke-width="0.8"/>
    <rect x="145" y="38" width="110" height="13" rx="7" fill="#d8eeff"/>
    <rect x="148" y="44" width="13" height="70" fill="#ffffff" opacity="0.22"/>
    <rect x="151" y="48" width="4" height="44" rx="2" fill="#ffffff" opacity="0.28"/>
    <!-- Logo area -->
    <rect x="168" y="62" width="64" height="26" rx="3" fill="#90b0d0" opacity="0.3"/>
    <text x="200" y="78" font-family="Georgia, serif" font-size="7" font-weight="bold" fill="#2050a0" text-anchor="middle" letter-spacing="1.5">FAUNWALK</text>
    <rect x="145" y="116" width="110" height="4" rx="1" fill="#6090c0"/>

    <!-- Bottom base -->
    <rect x="138" y="428" width="124" height="5" rx="2.5" fill="#2060b0" opacity="0.4"/>
    <ellipse cx="200" cy="440" rx="65" ry="5" fill="#2060c0" opacity="0.1"/>
  </g>
</svg>
