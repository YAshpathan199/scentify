<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 500" width="400" height="500">
  <defs>
    <!-- Clear glass -->
    <linearGradient id="at-glass" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#a0a090" stop-opacity="0.20"/>
      <stop offset="30%" stop-color="#c8c8b8" stop-opacity="0.11"/>
      <stop offset="68%" stop-color="#a0a090" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#787868" stop-opacity="0.24"/>
    </linearGradient>
    <!-- Pale golden yellow liquid -->
    <linearGradient id="at-liquid" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f8e898" stop-opacity="0.65"/>
      <stop offset="50%" stop-color="#f0d868" stop-opacity="0.58"/>
      <stop offset="100%" stop-color="#d8b840" stop-opacity="0.60"/>
    </linearGradient>
    <!-- Faceted crystal clear cap with gold collar -->
    <linearGradient id="at-cap-crystal" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f8f8f8" stop-opacity="0.95"/>
      <stop offset="30%" stop-color="#e8e8e8" stop-opacity="0.80"/>
      <stop offset="68%" stop-color="#f0f0f0" stop-opacity="0.90"/>
      <stop offset="100%" stop-color="#d8d8d8" stop-opacity="0.95"/>
    </linearGradient>
    <linearGradient id="at-cap-facet" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#d0d0d0" stop-opacity="0.80"/>
      <stop offset="100%" stop-color="#f8f8f8" stop-opacity="0.60"/>
    </linearGradient>
    <!-- Gold collar -->
    <linearGradient id="at-collar" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f0d060"/>
      <stop offset="50%" stop-color="#c89830"/>
      <stop offset="100%" stop-color="#906010"/>
    </linearGradient>
    <linearGradient id="at-hl" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#f8e890" stop-opacity="0.42"/>
      <stop offset="100%" stop-color="#f8e890" stop-opacity="0"/>
    </linearGradient>
    <filter id="at-sh"><feDropShadow dx="0" dy="12" stdDeviation="14" flood-color="#302010" flood-opacity="0.25"/></filter>
  </defs>
  <g filter="url(#at-sh)">
    <!-- Body 100ml, 112×295, tall ~11cm -->
    <rect x="144" y="148" width="112" height="295" rx="3" fill="url(#at-glass)" stroke="#b0a880" stroke-width="0.8"/>
    <clipPath id="at-cl"><rect x="147" y="151" width="106" height="289" rx="2"/></clipPath>
    <rect x="147" y="162" width="106" height="278" fill="url(#at-liquid)" clip-path="url(#at-cl)"/>
    <!-- Glass edge highlight -->
    <rect x="146" y="151" width="20" height="289" fill="url(#at-hl)" opacity="0.5"/>
    <rect x="149" y="180" width="4" height="120" rx="2" fill="#f8e890" opacity="0.18"/>
    <!-- Right edge reflection -->
    <rect x="253" y="151" width="3" height="289" fill="#c8b870" opacity="0.14"/>
    <!-- Black label panel -->
    <rect x="156" y="262" width="88" height="80" rx="1" fill="#0c0c0a" opacity="0.90"/>
    <!-- Gold text on label -->
    <text x="200" y="296" font-family="'Trebuchet MS',Arial,sans-serif" font-size="7" fill="#c89830" text-anchor="middle" letter-spacing="4" opacity="0.85">FAUNWALK</text>
    <text x="200" y="316" font-family="'Arial Narrow',Arial,sans-serif" font-size="18" font-weight="bold" fill="#d8a830" text-anchor="middle" letter-spacing="3" opacity="0.92">ATLAS</text>
    <!-- Thin gold line under name -->
    <line x1="170" y1="324" x2="230" y2="324" stroke="#c89830" stroke-width="0.6" opacity="0.6"/>
    <!-- Base -->
    <rect x="142" y="439" width="116" height="5" rx="2" fill="#302010" opacity="0.35"/>
    <!-- Neck -->
    <rect x="167" y="127" width="66" height="23" rx="2" fill="url(#at-glass)" stroke="#b0a880" stroke-width="0.7"/>
    <!-- Gold collar band above cap -->
    <rect x="150" y="120" width="100" height="10" rx="1" fill="url(#at-collar)"/>
    <!-- Tall faceted crystal cap -->
    <!-- Main cap body (crystal clear rectangle) -->
    <rect x="152" y="58" width="96" height="64" rx="3" fill="url(#at-cap-crystal)" stroke="#d8d8d4" stroke-width="0.6"/>
    <!-- Facet cut lines (create multi-face crystal look) -->
    <!-- Diagonal facet cuts top-left and top-right -->
    <polygon points="152,58 168,50 232,50 248,58" fill="url(#at-cap-facet)" stroke="#e0e0dc" stroke-width="0.5"/>
    <!-- Left facet -->
    <polygon points="152,58 148,66 148,118 152,122" fill="#d8d8d4" opacity="0.70"/>
    <!-- Right facet -->
    <polygon points="248,58 252,66 252,118 248,122" fill="#c8c8c4" opacity="0.60"/>
    <!-- Crystal vertical light lines -->
    <line x1="170" y1="52" x2="168" y2="120" stroke="#ffffff" stroke-width="1.0" opacity="0.35"/>
    <line x1="184" y1="50" x2="182" y2="122" stroke="#ffffff" stroke-width="0.6" opacity="0.22"/>
    <line x1="200" y1="50" x2="200" y2="122" stroke="#ffffff" stroke-width="0.8" opacity="0.28"/>
    <line x1="216" y1="50" x2="218" y2="122" stroke="#ffffff" stroke-width="0.6" opacity="0.22"/>
    <line x1="230" y1="52" x2="232" y2="120" stroke="#ffffff" stroke-width="1.0" opacity="0.35"/>
    <!-- Crystal top shine -->
    <ellipse cx="192" cy="52" rx="22" ry="4" fill="#ffffff" opacity="0.35"/>
    <!-- Crystal internal refraction (subtle diagonal bright lines) -->
    <line x1="156" y1="62" x2="244" y2="116" stroke="#f8f8f8" stroke-width="0.5" opacity="0.14"/>
    <line x1="156" y1="80" x2="224" y2="120" stroke="#f8f8f8" stroke-width="0.4" opacity="0.10"/>
    <ellipse cx="200" cy="451" rx="62" ry="5" fill="#302010" opacity="0.09"/>
  </g>
</svg>
