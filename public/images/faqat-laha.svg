<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 200" fill="none">
  <defs>
    <linearGradient id="bottleGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FDE8F0"/>
      <stop offset="50%" stop-color="#F4A8C0"/>
      <stop offset="100%" stop-color="#D96090"/>
    </linearGradient>
    <linearGradient id="capGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#F8C8DC"/>
      <stop offset="100%" stop-color="#D080A8"/>
    </linearGradient>
    <linearGradient id="shine" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="white" stop-opacity="0.4"/>
      <stop offset="45%" stop-color="white" stop-opacity="0.1"/>
      <stop offset="100%" stop-color="white" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <!-- Cap - wide flat -->
  <rect x="38" y="14" width="44" height="18" rx="5" fill="url(#capGrad)"/>
  <rect x="46" y="10" width="28" height="8" rx="3" fill="#E898C0"/>
  <!-- Neck -->
  <rect x="50" y="32" width="20" height="20" rx="2" fill="#E0A0C0"/>
  <!-- Body - tall narrow -->
  <rect x="26" y="52" width="68" height="116" rx="12" fill="url(#bottleGrad)"/>
  <rect x="26" y="52" width="68" height="116" rx="12" fill="url(#shine)"/>
  <!-- Gold trim lines -->
  <rect x="26" y="68" width="68" height="2" rx="1" fill="white" fill-opacity="0.4"/>
  <rect x="26" y="150" width="68" height="2" rx="1" fill="white" fill-opacity="0.4"/>
  <!-- Label -->
  <rect x="34" y="80" width="52" height="58" rx="6" fill="white" fill-opacity="0.22"/>
  <rect x="42" y="92" width="36" height="4" rx="2" fill="white" fill-opacity="0.75"/>
  <rect x="46" y="102" width="28" height="3" rx="1.5" fill="white" fill-opacity="0.55"/>
  <rect x="42" y="111" width="36" height="3" rx="1.5" fill="white" fill-opacity="0.4"/>
  <rect x="46" y="120" width="28" height="2.5" rx="1.25" fill="white" fill-opacity="0.3"/>
</svg>
