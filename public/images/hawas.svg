<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 500" width="400" height="500">
  <defs>
    <linearGradient id="hw-glass" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#1e3c58" stop-opacity="0.95"/>
      <stop offset="28%" stop-color="#2e5878" stop-opacity="0.80"/>
      <stop offset="68%" stop-color="#203050" stop-opacity="0.88"/>
      <stop offset="100%" stop-color="#182840" stop-opacity="0.98"/>
    </linearGradient>
    <linearGradient id="hw-liquid" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#5888b8"/>
      <stop offset="45%" stop-color="#3a6090"/>
      <stop offset="100%" stop-color="#1e3858"/>
    </linearGradient>
    <linearGradient id="hw-cap" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2a2a2a"/>
      <stop offset="100%" stop-color="#080808"/>
    </linearGradient>
    <linearGradient id="hw-ring" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e0e8f0"/>
      <stop offset="50%" stop-color="#b0bcc8"/>
      <stop offset="100%" stop-color="#7888a0"/>
    </linearGradient>
    <pattern id="hw-scales" patternUnits="userSpaceOnUse" width="10" height="10">
      <path d="M5,0 L10,5 L5,10 L0,5 Z" fill="none" stroke="#484848" stroke-width="0.7" opacity="0.55"/>
    </pattern>
    <linearGradient id="hw-hl" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#90b8d8" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#90b8d8" stop-opacity="0"/>
    </linearGradient>
    <filter id="hw-sh"><feDropShadow dx="0" dy="12" stdDeviation="14" flood-color="#0e1e30" flood-opacity="0.35"/></filter>
  </defs>
  <g filter="url(#hw-sh)">
    <!-- Body 100ml, 112×295 -->
    <rect x="144" y="145" width="112" height="295" rx="3" fill="url(#hw-glass)" stroke="#2e5070" stroke-width="0.8"/>
    <clipPath id="hw-cl"><rect x="147" y="148" width="106" height="289" rx="2"/></clipPath>
    <rect x="147" y="162" width="106" height="275" fill="url(#hw-liquid)" clip-path="url(#hw-cl)" opacity="0.80"/>
    <!-- Left edge highlight -->
    <rect x="146" y="148" width="20" height="289" fill="url(#hw-hl)" opacity="0.55"/>
    <rect x="149" y="175" width="4" height="115" rx="2" fill="#c0dcf0" opacity="0.18"/>
    <!-- HAWAS text on glass -->
    <text x="200" y="272" font-family="'Arial Narrow',Arial,sans-serif" font-size="15" font-weight="bold" fill="#8ab8d8" text-anchor="middle" letter-spacing="6" opacity="0.72">HAWAS</text>
    <text x="200" y="291" font-family="Arial,sans-serif" font-size="7.5" fill="#6898b8" text-anchor="middle" letter-spacing="3" opacity="0.60">FOR HIM</text>
    <line x1="166" y1="302" x2="234" y2="302" stroke="#6898b8" stroke-width="0.5" opacity="0.4"/>
    <!-- Base -->
    <rect x="142" y="436" width="116" height="5" rx="2" fill="#182838" opacity="0.5"/>
    <!-- Neck -->
    <rect x="167" y="124" width="66" height="23" rx="2" fill="url(#hw-glass)" stroke="#2e5070" stroke-width="0.7"/>
    <!-- Silver ring at base of cap -->
    <rect x="161" y="130" width="78" height="8" rx="1" fill="url(#hw-ring)"/>
    <!-- Flat black cap with snake scale texture -->
    <rect x="150" y="72" width="100" height="62" rx="2" fill="url(#hw-cap)"/>
    <rect x="150" y="72" width="100" height="62" rx="2" fill="url(#hw-scales)" opacity="0.75"/>
    <rect x="150" y="72" width="100" height="6" rx="2" fill="#323232"/>
    <rect x="153" y="78" width="8" height="52" fill="#ffffff" opacity="0.04"/>
    <rect x="150" y="128" width="100" height="4" rx="1" fill="#101010"/>
    <ellipse cx="200" cy="447" rx="62" ry="5" fill="#0e1e30" opacity="0.1"/>
  </g>
</svg>
