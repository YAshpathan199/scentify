<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 500" width="400" height="500">
  <defs>
    <!-- Frosted white, near-opaque glass -->
    <linearGradient id="wo-glass" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#ece8e0" stop-opacity="0.97"/>
      <stop offset="30%" stop-color="#f8f4f0" stop-opacity="0.90"/>
      <stop offset="68%" stop-color="#e8e4dc" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#d8d4cc" stop-opacity="0.98"/>
    </linearGradient>
    <!-- Gold dome cap -->
    <radialGradient id="wo-cap-dome" cx="40%" cy="30%" r="65%">
      <stop offset="0%" stop-color="#f0d060"/>
      <stop offset="45%" stop-color="#c89830"/>
      <stop offset="100%" stop-color="#806010"/>
    </radialGradient>
    <linearGradient id="wo-hl" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <filter id="wo-sh"><feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#888880" flood-opacity="0.3"/></filter>
  </defs>
  <g filter="url(#wo-sh)">
    <!-- Same tapered shape as Oud Nirvana but frosted white -->
    <path d="M172,220 Q164,220 164,230 L164,415 Q164,418 167,418 L233,418 Q236,418 236,415 L236,230 Q236,220 228,220 Q220,194 200,190 Q180,194 172,220 Z" fill="url(#wo-glass)" stroke="#c8c4bc" stroke-width="0.8"/>
    <!-- No visible liquid (frosted opaque) -->
    <!-- Frosted sheen lines -->
    <path d="M172,220 Q164,220 164,230 L164,415" fill="none" stroke="url(#wo-hl)" stroke-width="14" opacity="0.5"/>
    <rect x="168" y="225" width="4" height="140" rx="2" fill="#ffffff" opacity="0.35"/>
    <!-- Name on frosted glass -->
    <text x="200" y="312" font-family="Georgia,serif" font-size="9.5" fill="#b09880" text-anchor="middle" letter-spacing="0.5" opacity="0.85">White Oud</text>
    <text x="200" y="327" font-family="Arial,sans-serif" font-size="6" fill="#c0a870" text-anchor="middle" letter-spacing="2" opacity="0.70">AJMAL</text>
    <!-- Neck -->
    <rect x="183" y="168" width="34" height="24" rx="2" fill="url(#wo-glass)" stroke="#c8c4bc" stroke-width="0.7"/>
    <!-- Gold ribbed dome cap (same as nirvana) -->
    <ellipse cx="200" cy="150" rx="30" ry="22" fill="url(#wo-cap-dome)" stroke="#c09020" stroke-width="0.8"/>
    <line x1="184" y1="138" x2="184" y2="171" stroke="#a07820" stroke-width="0.6" opacity="0.5"/>
    <line x1="191" y1="132" x2="191" y2="171" stroke="#a07820" stroke-width="0.6" opacity="0.5"/>
    <line x1="200" y1="130" x2="200" y2="171" stroke="#a07820" stroke-width="0.6" opacity="0.5"/>
    <line x1="209" y1="132" x2="209" y2="171" stroke="#a07820" stroke-width="0.6" opacity="0.5"/>
    <line x1="216" y1="138" x2="216" y2="171" stroke="#a07820" stroke-width="0.6" opacity="0.5"/>
    <ellipse cx="192" cy="143" rx="10" ry="7" fill="#f8e890" opacity="0.25"/>
    <rect x="162" y="413" width="76" height="5" rx="2" fill="#a09888" opacity="0.35"/>
    <ellipse cx="200" cy="427" rx="42" ry="4" fill="#888880" opacity="0.1"/>
  </g>
</svg>
