<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 500" fill="none">
  <defs>
    <!-- Bottle glass gradient -->
    <linearGradient id="glassGrad" x1="0" y1="0" x2="1" y2="0.8">
      <stop offset="0%" stop-color="#e8f5f5" stop-opacity="0.55"/>
      <stop offset="50%" stop-color="#d5eded" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#c5e0e0" stop-opacity="0.45"/>
    </linearGradient>
    <!-- Cool teal liquid gradient -->
    <linearGradient id="liquidGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#30c8c0" stop-opacity="0.7"/>
      <stop offset="30%" stop-color="#20B2AA"/>
      <stop offset="65%" stop-color="#189090"/>
      <stop offset="100%" stop-color="#107070"/>
    </linearGradient>
    <!-- Mint accent gradient -->
    <linearGradient id="mintGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#60e8d8" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#20B2AA" stop-opacity="0.1"/>
    </linearGradient>
    <!-- Glass highlight -->
    <linearGradient id="highlightGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <!-- Chrome cap gradient -->
    <linearGradient id="capGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f0f0f0"/>
      <stop offset="20%" stop-color="#d0d0d0"/>
      <stop offset="40%" stop-color="#e8e8e8"/>
      <stop offset="60%" stop-color="#b8b8b8"/>
      <stop offset="80%" stop-color="#d8d8d8"/>
      <stop offset="100%" stop-color="#c0c0c0"/>
    </linearGradient>
    <!-- Drop shadow filter -->
    <filter id="shadow" x="-10%" y="-5%" width="120%" height="115%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="8" result="blur"/>
      <feOffset in="blur" dx="0" dy="6" result="offsetBlur"/>
      <feFlood flood-color="#000000" flood-opacity="0.12" result="color"/>
      <feComposite in="color" in2="offsetBlur" operator="in" result="shadow"/>
      <feMerge>
        <feMergeNode in="shadow"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <!-- Reflection -->
    <radialGradient id="reflectionGrad" cx="0.3" cy="0.3" r="0.45">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Shadow beneath bottle -->
  <ellipse cx="200" cy="462" rx="65" ry="10" fill="#000" opacity="0.09"/>

  <g filter="url(#shadow)">
    <!-- Sleek modern tall bottle, slightly tapered at top -->
    <path d="
      M 155 140
      Q 148 155 145 180
      L 140 430
      Q 140 450 155 450
      L 245 450
      Q 260 450 260 430
      L 255 180
      Q 252 155 245 140
      Z
    " fill="url(#glassGrad)" stroke="#b8d8d8" stroke-width="1"/>

    <!-- Liquid fill -->
    <path d="
      M 147 210
      L 142 430
      Q 142 448 155 448
      L 245 448
      Q 258 448 258 430
      L 253 210
      Z
    " fill="url(#liquidGrad)"/>

    <!-- Mint accent strip inside liquid -->
    <rect x="148" y="230" width="20" height="200" rx="10" fill="url(#mintGrad)"/>

    <!-- Glass highlight -->
    <path d="
      M 155 150
      L 153 160
      L 150 350
      L 160 350
      L 162 160
      L 160 150
      Z
    " fill="url(#highlightGrad)"/>

    <!-- Large reflection oval -->
    <ellipse cx="170" cy="300" rx="16" ry="85" fill="url(#reflectionGrad)" transform="rotate(-2 170 300)"/>

    <!-- Bottle neck - slim modern -->
    <rect x="177" y="100" width="46" height="44" rx="3" fill="url(#glassGrad)" stroke="#b8d8d8" stroke-width="1"/>

    <!-- Neck highlight -->
    <rect x="182" y="105" width="4" height="35" rx="2" fill="#ffffff" opacity="0.25"/>

    <!-- Flat modern chrome cap -->
    <rect x="168" y="72" width="64" height="32" rx="3" fill="url(#capGrad)" stroke="#a8a8a8" stroke-width="0.8"/>

    <!-- Cap highlight line -->
    <rect x="174" y="76" width="4" height="24" rx="2" fill="#ffffff" opacity="0.35"/>

    <!-- Cap top edge -->
    <rect x="168" y="72" width="64" height="3" rx="2" fill="#e0e0e0"/>

    <!-- Cap bottom edge line -->
    <line x1="168" y1="103" x2="232" y2="103" stroke="#b0b0b0" stroke-width="0.5"/>
  </g>
</svg>