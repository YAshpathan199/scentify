      <stop offset="0%" stop-color="#c08060" stop-opacity="0.22"/>
      <stop offset="30%" stop-color="#e0a880" stop-opacity="0.13"/>
      <stop offset="68%" stop-color="#c08060" stop-opacity="0.17"/>
      <stop offset="100%" stop-color="#a06040" stop-opacity="0.26"/>
    </linearGradient>
    <!-- Bright orange-pink liquid (Runway) -->
