<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 500" width="400" height="500">
  <defs>
    <!-- Clear glass — very subtle warm grey tint -->
    <linearGradient id="ss-glass" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#a8a8a0" stop-opacity="0.18"/>
      <stop offset="30%" stop-color="#c8c8c0" stop-opacity="0.10"/>
      <stop offset="68%" stop-color="#a8a8a0" stop-opacity="0.14"/>
      <stop offset="100%" stop-color="#888880" stop-opacity="0.22"/>
    </linearGradient>
    <!-- Pale straw liquid, very light -->
    <linearGradient id="ss-liquid" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f8f4e0" stop-opacity="0.45"/>
      <stop offset="60%" stop-color="#f0ead0" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#e0d8b8" stop-opacity="0.40"/>
    </linearGradient>
    <!-- Wide T-bar silver cap -->
    <linearGradient id="ss-cap" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f0f0ee"/>
      <stop offset="30%" stop-color="#d0d0cc"/>
      <stop offset="70%" stop-color="#b0b0ac"/>
      <stop offset="100%" stop-color="#888888"/>
    </linearGradient>
    <linearGradient id="ss-cap-side" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#c8c8c4"/>
      <stop offset="100%" stop-color="#787878"/>
    </linearGradient>
    <linearGradient id="ss-hl" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <filter id="ss-sh"><feDropShadow dx="0" dy="12" stdDeviation="14" flood-color="#404040" flood-opacity="0.2"/></filter>
  </defs>
  <g filter="url(#ss-sh)">
    <!-- Body 100ml, 112×300, tall ~12cm -->
    <rect x="144" y="142" width="112" height="300" rx="3" fill="url(#ss-glass)" stroke="#b0b0a8" stroke-width="0.8"/>
    <clipPath id="ss-cl"><rect x="147" y="145" width="106" height="294" rx="2"/></clipPath>
    <rect x="147" y="158" width="106" height="280" fill="url(#ss-liquid)" clip-path="url(#ss-cl)"/>
    <!-- Left edge highlight (glass edge) -->
    <rect x="146" y="145" width="20" height="294" fill="url(#ss-hl)" opacity="0.5"/>
    <rect x="149" y="175" width="4" height="130" rx="2" fill="#ffffff" opacity="0.22"/>
    <!-- Right edge line -->
    <rect x="253" y="145" width="3" height="294" fill="#888880" opacity="0.12"/>
    <!-- SILENT STORM text on clear glass -->
    <text x="200" y="268" font-family="'Arial Narrow',Arial,sans-serif" font-size="11" font-weight="bold" fill="#484840" text-anchor="middle" letter-spacing="4" opacity="0.65">SILENT STORM</text>
    <!-- Ajmal small logo under name -->
    <text x="200" y="284" font-family="Arial,sans-serif" font-size="6.5" fill="#686860" text-anchor="middle" letter-spacing="2.5" opacity="0.5">AJMAL</text>
    <line x1="167" y1="293" x2="233" y2="293" stroke="#808078" stroke-width="0.5" opacity="0.35"/>
    <!-- Base -->
    <rect x="142" y="438" width="116" height="5" rx="2" fill="#606058" opacity="0.35"/>
    <!-- Neck connector (narrow, connects body to T-bar) -->
    <rect x="168" y="118" width="64" height="26" rx="2" fill="url(#ss-glass)" stroke="#b0b0a8" stroke-width="0.7"/>
    <!-- WIDE T-BAR CAP — extends 24px beyond each side -->
    <!-- The T-bar overhang on each side -->
    <rect x="120" y="80" width="160" height="40" rx="3" fill="url(#ss-cap)" stroke="#c0c0bc" stroke-width="0.6"/>
    <!-- Chrome shine line on top of cap -->
    <rect x="122" y="80" width="156" height="6" rx="2" fill="#f8f8f6"/>
    <!-- Left overhang underside (slight shadow) -->
    <rect x="120" y="116" width="24" height="4" rx="1" fill="#808080" opacity="0.4"/>
    <!-- Right overhang underside -->
    <rect x="256" y="116" width="24" height="4" rx="1" fill="#808080" opacity="0.4"/>
    <!-- Main cap underside between body -->
    <rect x="144" y="116" width="112" height="4" rx="1" fill="#909090" opacity="0.5"/>
    <!-- Cap left highlight -->
    <rect x="124" y="84" width="10" height="30" fill="#ffffff" opacity="0.22"/>
    <!-- Cap center dip (slight shadow center) -->
    <rect x="195" y="82" width="10" height="36" fill="#c8c8c4" opacity="0.3"/>
    <ellipse cx="200" cy="449" rx="62" ry="5" fill="#404040" opacity="0.08"/>
  </g>
</svg>
