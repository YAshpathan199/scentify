<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 200" fill="none">
  <defs>
    <linearGradient id="bottleGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FFD6E0"/>
      <stop offset="50%" stop-color="#FFB3C6"/>
      <stop offset="100%" stop-color="#FF8FAB"/>
    </linearGradient>
    <linearGradient id="capGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFE8F0"/>
      <stop offset="100%" stop-color="#FFAAC8"/>
    </linearGradient>
    <linearGradient id="shine" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="white" stop-opacity="0.45"/>
      <stop offset="50%" stop-color="white" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="white" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <!-- Cap - rounded dome -->
  <ellipse cx="60" cy="18" rx="20" ry="14" fill="url(#capGrad)"/>
  <!-- Neck -->
  <rect x="51" y="30" width="18" height="20" rx="2" fill="#FFB8D0"/>
  <!-- Body - curved sides -->
  <path d="M28 50 Q20 70 20 100 L20 158 Q20 172 34 172 L86 172 Q100 172 100 158 L100 100 Q100 70 92 50 Z" fill="url(#bottleGrad)"/>
  <path d="M28 50 Q20 70 20 100 L20 158 Q20 172 34 172 L86 172 Q100 172 100 158 L100 100 Q100 70 92 50 Z" fill="url(#shine)"/>
  <!-- Label -->
  <rect x="30" y="80" width="60" height="58" rx="8" fill="white" fill-opacity="0.25"/>
  <rect x="38" y="93" width="44" height="4" rx="2" fill="white" fill-opacity="0.8"/>
  <rect x="43" y="103" width="34" height="3" rx="1.5" fill="white" fill-opacity="0.6"/>
  <rect x="38" y="112" width="44" height="3" rx="1.5" fill="white" fill-opacity="0.45"/>
  <!-- Heart accent -->
  <path d="M54 128 Q54 123 60 128 Q66 123 66 128 Q66 134 60 138 Q54 134 54 128 Z" fill="white" fill-opacity="0.3"/>
</svg>
