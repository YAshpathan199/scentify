<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 500" width="400" height="500">
  <defs>
    <linearGradient id="av-glass" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#3d1020" stop-opacity="0.95"/>
      <stop offset="30%" stop-color="#581828" stop-opacity="0.82"/>
      <stop offset="68%" stop-color="#3d1020" stop-opacity="0.90"/>
      <stop offset="100%" stop-color="#250810" stop-opacity="0.98"/>
    </linearGradient>
    <linearGradient id="av-liquid" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7a3808"/>
      <stop offset="50%" stop-color="#4a2008"/>
      <stop offset="100%" stop-color="#280e04"/>
    </linearGradient>
    <linearGradient id="av-cap" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#3c1a0c"/>
      <stop offset="100%" stop-color="#160804"/>
    </linearGradient>
    <linearGradient id="av-hl" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#c08060" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#c08060" stop-opacity="0"/>
    </linearGradient>
    <filter id="av-sh"><feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#180608" flood-opacity="0.4"/></filter>
  </defs>
  <g filter="url(#av-sh)">
    <!-- Body 50ml, 96×268 -->
    <rect x="152" y="160" width="96" height="268" rx="3" fill="url(#av-glass)" stroke="#501828" stroke-width="0.8"/>
    <clipPath id="av-cl"><rect x="155" y="163" width="90" height="262" rx="2"/></clipPath>
    <rect x="155" y="174" width="90" height="251" fill="url(#av-liquid)" clip-path="url(#av-cl)" opacity="0.70"/>
    <rect x="154" y="163" width="17" height="262" fill="url(#av-hl)" opacity="0.5"/>
    <rect x="157" y="185" width="3" height="90" rx="1.5" fill="#f0a870" opacity="0.08"/>
    <!-- Gold text on glass -->
    <text x="200" y="260" font-family="'Trebuchet MS',Arial,sans-serif" font-size="6.5" fill="#c89050" text-anchor="middle" letter-spacing="2.5" opacity="0.85">COLOGNE HOUSE</text>
    <text x="200" y="278" font-family="Georgia,serif" font-size="10.5" font-weight="bold" fill="#d8a860" text-anchor="middle" letter-spacing="0.5" opacity="0.78">Aventus Legacy</text>
    <line x1="170" y1="289" x2="230" y2="289" stroke="#c89050" stroke-width="0.5" opacity="0.4"/>
    <!-- Base -->
    <rect x="150" y="424" width="100" height="4" rx="2" fill="#180608" opacity="0.4"/>
    <!-- Neck -->
    <rect x="176" y="141" width="48" height="21" rx="2" fill="url(#av-glass)" stroke="#501828" stroke-width="0.7"/>
    <!-- Flat dark brown cap with ribbed side edges -->
    <rect x="156" y="88" width="88" height="55" rx="2" fill="url(#av-cap)"/>
    <!-- Ribbed sides (narrow vertical panels at edges) -->
    <rect x="156" y="90" width="8" height="51" rx="1" fill="#280c04" opacity="0.9"/>
    <rect x="236" y="90" width="8" height="51" rx="1" fill="#280c04" opacity="0.9"/>
    <!-- Rib lines on side panels -->
    <line x1="159" y1="92" x2="159" y2="139" stroke="#ffffff" stroke-width="0.4" opacity="0.08"/>
    <line x1="162" y1="92" x2="162" y2="139" stroke="#ffffff" stroke-width="0.4" opacity="0.08"/>
    <line x1="239" y1="92" x2="239" y2="139" stroke="#ffffff" stroke-width="0.4" opacity="0.08"/>
    <line x1="242" y1="92" x2="242" y2="139" stroke="#ffffff" stroke-width="0.4" opacity="0.08"/>
    <rect x="156" y="88" width="88" height="6" rx="2" fill="#481c0c"/>
    <rect x="159" y="94" width="7" height="45" fill="#ffffff" opacity="0.04"/>
    <rect x="156" y="139" width="88" height="4" rx="1" fill="#180800"/>
    <ellipse cx="200" cy="434" rx="52" ry="4" fill="#180608" opacity="0.1"/>
  </g>
</svg>
