<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 500" width="400" height="500">
  <defs>
    <!-- Clear glass, very light -->
    <linearGradient id="tp-glass" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#a0a090" stop-opacity="0.18"/>
      <stop offset="30%" stop-color="#c8c8b8" stop-opacity="0.11"/>
      <stop offset="68%" stop-color="#a0a090" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#808070" stop-opacity="0.22"/>
    </linearGradient>
    <!-- Pale straw liquid -->
    <linearGradient id="tp-liquid" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f8f4e0" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#e8e0c0" stop-opacity="0.42"/>
    </linearGradient>
    <!-- Tall round gold cap -->
    <radialGradient id="tp-cap" cx="35%" cy="25%" r="70%">
      <stop offset="0%" stop-color="#f0d868"/>
      <stop offset="45%" stop-color="#c8a030"/>
      <stop offset="100%" stop-color="#806010"/>
    </radialGradient>
    <linearGradient id="tp-cap-side" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e8c850"/>
      <stop offset="100%" stop-color="#806010"/>
    </linearGradient>
    <linearGradient id="tp-hl" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <filter id="tp-sh"><feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#303020" flood-opacity="0.2"/></filter>
  </defs>
  <g filter="url(#tp-sh)">
    <!-- Body 14ml, narrow 48×215, x:176-224, y:185-400 -->
    <rect x="176" y="185" width="48" height="215" rx="3" fill="url(#tp-glass)" stroke="#a0a090" stroke-width="0.8"/>
    <clipPath id="tp-cl"><rect x="179" y="188" width="42" height="209" rx="2"/></clipPath>
    <rect x="179" y="196" width="42" height="202" fill="url(#tp-liquid)" clip-path="url(#tp-cl)"/>
    <!-- Glass edge highlights -->
    <rect x="178" y="188" width="12" height="209" fill="url(#tp-hl)" opacity="0.5"/>
    <rect x="181" y="210" width="3" height="90" rx="1.5" fill="#ffffff" opacity="0.22"/>
    <!-- Ajmal logo dot + text -->
    <circle cx="200" cy="274" r="4" fill="none" stroke="#484838" stroke-width="0.8" opacity="0.5"/>
    <circle cx="200" cy="274" r="1.5" fill="#484838" opacity="0.5"/>
    <text x="200" y="291" font-family="Arial,sans-serif" font-size="6.5" font-weight="bold" fill="#383828" text-anchor="middle" letter-spacing="2.5" opacity="0.65">ARISTOCRAT</text>
    <text x="200" y="303" font-family="Arial,sans-serif" font-size="5.5" fill="#585848" text-anchor="middle" letter-spacing="1.5" opacity="0.5">AJMAL</text>
    <!-- Base -->
    <rect x="174" y="397" width="52" height="4" rx="2" fill="#484838" opacity="0.3"/>
    <!-- Neck (narrow connector to cap) -->
    <rect x="184" y="167" width="32" height="20" rx="2" fill="url(#tp-glass)" stroke="#a0a090" stroke-width="0.6"/>
    <!-- Tall round gold cap — proportionally tall for 14ml -->
    <!-- Cap cylinder (tall) -->
    <rect x="178" y="102" width="44" height="67" rx="4" fill="url(#tp-cap-side)"/>
    <!-- Cap top dome -->
    <ellipse cx="200" cy="102" rx="22" ry="8" fill="url(#tp-cap)"/>
    <!-- Cap rim at bottom -->
    <rect x="178" y="162" width="44" height="8" rx="2" fill="#c8a030" opacity="0.8"/>
    <!-- Cap left highlight -->
    <rect x="181" y="106" width="6" height="58" rx="3" fill="#ffffff" opacity="0.18"/>
    <!-- Cap top shine -->
    <ellipse cx="192" cy="100" rx="8" ry="4" fill="#f8f0a0" opacity="0.3"/>
    <ellipse cx="200" cy="409" rx="28" ry="3" fill="#303020" opacity="0.08"/>
  </g>
</svg>
