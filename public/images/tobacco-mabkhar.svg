<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 500" fill="none">
  <defs>
    <linearGradient id="glassGrad" x1="0" y1="0" x2="1" y2="0.6">
      <stop offset="0%" stop-color="#3a2a1a" stop-opacity="0.7"/>
      <stop offset="50%" stop-color="#2a1e12" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#1e1410" stop-opacity="0.9"/>
    </linearGradient>
    <linearGradient id="liquidGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#8B4513" stop-opacity="0.8"/>
      <stop offset="30%" stop-color="#6b3410"/>
      <stop offset="60%" stop-color="#4a2008"/>
      <stop offset="100%" stop-color="#2d1205"/>
    </linearGradient>
    <linearGradient id="highlightGrad" x1="0" y1="0" x2="1" y2="0.5">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="capGrad" x1="0" y1="0" x2="0.8" y2="1">
      <stop offset="0%" stop-color="#c9a84c"/>
      <stop offset="25%" stop-color="#a8873a"/>
      <stop offset="50%" stop-color="#c9a84c"/>
      <stop offset="75%" stop-color="#8a6e2f"/>
      <stop offset="100%" stop-color="#a8873a"/>
    </linearGradient>
    <linearGradient id="ornateGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#d4b85c"/>
      <stop offset="50%" stop-color="#a88838"/>
      <stop offset="100%" stop-color="#7a6428"/>
    </linearGradient>
    <linearGradient id="labelGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#c9a84c" stop-opacity="0.3"/>
      <stop offset="50%" stop-color="#a8873a" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#c9a84c" stop-opacity="0.3"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-5%" width="120%" height="115%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="9" result="blur"/>
      <feOffset in="blur" dx="0" dy="7" result="offsetBlur"/>
      <feFlood flood-color="#000000" flood-opacity="0.2" result="color"/>
      <feComposite in="color" in2="offsetBlur" operator="in" result="shadow"/>
      <feMerge>
        <feMergeNode in="shadow"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <radialGradient id="reflectionGrad" cx="0.28" cy="0.35" r="0.45">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <ellipse cx="200" cy="462" rx="90" ry="12" fill="#000" opacity="0.14"/>

  <g filter="url(#shadow)">
    <!-- Dark bottle body - rectangular with slight curve -->
    <path d="
      M 125 160
      Q 120 170 120 190
      L 125 440
      Q 127 452 145 452
      L 255 452
      Q 273 452 275 440
      L 280 190
      Q 280 170 275 160
      Z
    " fill="url(#glassGrad)" stroke="#4a3520" stroke-width="1"/>

    <!-- Liquid -->
    <path d="
      M 123 210
      L 127 438
      Q 129 450 145 450
      L 255 450
      Q 271 450 273 438
      L 277 210
      Z
    " fill="url(#liquidGrad)"/>

    <!-- Glass highlight strip -->
    <path d="
      M 135 170
      L 133 180
      L 138 410
      L 146 410
      L 143 180
      L 140 170
      Z
    " fill="url(#highlightGrad)"/>

    <!-- Large reflection -->
    <ellipse cx="155" cy="310" rx="18" ry="80" fill="url(#reflectionGrad)" transform="rotate(-3 155 310)"/>

    <!-- Gold label area on bottle -->
    <rect x="145" y="280" width="110" height="80" rx="3" fill="url(#labelGrad)" stroke="#c9a84c" stroke-width="0.8" opacity="0.7"/>
    <!-- Label decorative lines -->
    <line x1="155" y1="300" x2="245" y2="300" stroke="#c9a84c" stroke-width="0.5" opacity="0.5"/>
    <line x1="155" y1="340" x2="245" y2="340" stroke="#c9a84c" stroke-width="0.5" opacity="0.5"/>

    <!-- Bottle neck -->
    <path d="
      M 178 108
      L 178 160
      L 222 160
      L 222 108
      Q 220 103 217 103
      L 183 103
      Q 180 103 178 108
      Z
    " fill="url(#glassGrad)" stroke="#4a3520" stroke-width="1"/>

    <!-- Neck highlight -->
    <rect x="183" y="112" width="4" height="45" rx="2" fill="#ffffff" opacity="0.15"/>

    <!-- Gold ornate cap - taller, Middle Eastern style -->
    <path d="
      M 162 28
      L 162 103
      L 238 103
      L 238 28
      Q 238 18 228 18
      L 172 18
      Q 162 18 162 28
      Z
    " fill="url(#capGrad)" stroke="#8a6e2f" stroke-width="0.8"/>

    <!-- Cap decorative bands -->
    <rect x="162" y="38" width="76" height="2.5" rx="1" fill="#d4b85c" opacity="0.7"/>
    <rect x="162" y="52" width="76" height="2.5" rx="1" fill="#d4b85c" opacity="0.6"/>
    <rect x="162" y="66" width="76" height="2.5" rx="1" fill="#d4b85c" opacity="0.5"/>
    <rect x="162" y="80" width="76" height="2.5" rx="1" fill="#d4b85c" opacity="0.6"/>
    <rect x="162" y="94" width="76" height="2.5" rx="1" fill="#d4b85c" opacity="0.7"/>

    <!-- Cap highlight -->
    <rect x="170" y="22" width="5" height="78" rx="2.5" fill="#ffffff" opacity="0.18"/>

    <!-- Cap top crown -->
    <rect x="162" y="18" width="76" height="5" rx="2.5" fill="#c9a84c" opacity="0.8"/>

    <!-- Ornate diamond on cap -->
    <path d="M 200 30 L 208 42 L 200 54 L 192 42 Z" fill="url(#ornateGrad)" stroke="#c9a84c" stroke-width="0.6"/>
    <!-- Inner diamond detail -->
    <path d="M 200 35 L 204 42 L 200 49 L 196 42 Z" fill="none" stroke="#d4b85c" stroke-width="0.4" opacity="0.6"/>
  </g>
</svg>
