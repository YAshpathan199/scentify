<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 500" width="400" height="500">
  <defs>
    <!-- Clear glass for faceted/hexagonal bottle -->
    <linearGradient id="tm-glass" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#a08060" stop-opacity="0.22"/>
      <stop offset="30%" stop-color="#c8b898" stop-opacity="0.13"/>
      <stop offset="68%" stop-color="#a08060" stop-opacity="0.17"/>
      <stop offset="100%" stop-color="#806040" stop-opacity="0.26"/>
    </linearGradient>
    <!-- Dark amber-brown liquid -->
    <linearGradient id="tm-liquid" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#8a4808"/>
      <stop offset="50%" stop-color="#5a2c04"/>
      <stop offset="100%" stop-color="#301400"/>
    </linearGradient>
    <!-- Facet face fills: alternate lighter/darker for 3D effect -->
    <linearGradient id="tm-facet-l" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#c0a080" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#a08060" stop-opacity="0.14"/>
    </linearGradient>
    <linearGradient id="tm-facet-d" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#806040" stop-opacity="0.30"/>
      <stop offset="100%" stop-color="#604020" stop-opacity="0.26"/>
    </linearGradient>
    <!-- Tall ornate silver cap -->
    <linearGradient id="tm-cap" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f0f0ee"/>
      <stop offset="30%" stop-color="#d0d0cc"/>
      <stop offset="68%" stop-color="#b0b0ac"/>
      <stop offset="100%" stop-color="#888888"/>
    </linearGradient>
    <linearGradient id="tm-cap-eng" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e8e8e4"/>
      <stop offset="100%" stop-color="#b8b8b4"/>
    </linearGradient>
    <filter id="tm-sh"><feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#180a00" flood-opacity="0.35"/></filter>
  </defs>
  <g filter="url(#tm-sh)">
    <!-- Faceted hexagonal body — approximate with 6 visible faces using polygon + rects -->
    <!-- Main front face (widest) -->
    <rect x="156" y="162" width="88" height="264" rx="2" fill="url(#tm-glass)" stroke="#a08060" stroke-width="0.6"/>
    <!-- Left angled facet face (creates faceted 3D look) -->
    <polygon points="156,162 148,170 148,422 156,426" fill="url(#tm-facet-d)" stroke="#907050" stroke-width="0.5"/>
    <!-- Right angled facet face -->
    <polygon points="244,162 252,170 252,422 244,426" fill="url(#tm-facet-d)" stroke="#907050" stroke-width="0.5"/>
    <!-- Top-left bevel -->
    <polygon points="156,162 164,154 236,154 244,162" fill="url(#tm-facet-l)" stroke="#c0a070" stroke-width="0.5"/>
    <!-- Clip for liquid -->
    <clipPath id="tm-cl"><rect x="159" y="165" width="82" height="258" rx="1"/></clipPath>
    <rect x="159" y="176" width="82" height="247" fill="url(#tm-liquid)" clip-path="url(#tm-cl)" opacity="0.78"/>
    <!-- Glass edge reflection on front -->
    <rect x="158" y="165" width="14" height="258" fill="#f0d0a0" opacity="0.08"/>
    <rect x="161" y="195" width="4" height="100" rx="2" fill="#f0d0a0" opacity="0.06"/>
    <!-- Arabic calligraphy style decorative text -->
    <!-- Decorative top line (ornamental) -->
    <text x="200" y="248" font-family="Georgia,'Times New Roman',serif" font-size="12" fill="#c09050" text-anchor="middle" letter-spacing="1" opacity="0.80">Ibrahim Al Qurashi</text>
    <!-- Arabic-style ornament (approximated) -->
    <text x="200" y="268" font-family="Georgia,serif" font-size="9" fill="#b08040" text-anchor="middle" letter-spacing="2" opacity="0.70">TOBACCO MABKHAR</text>
    <!-- Decorative diamond ornament line -->
    <text x="200" y="284" font-family="Arial" font-size="8" fill="#c09050" text-anchor="middle" opacity="0.55">◆ ✦ ◆</text>
    <!-- Base -->
    <polygon points="148,422 156,426 244,426 252,422" fill="#180800" opacity="0.4"/>
    <!-- Neck (faceted, narrower) -->
    <rect x="174" y="142" width="52" height="22" rx="2" fill="url(#tm-glass)" stroke="#a08060" stroke-width="0.6"/>
    <polygon points="174,142 170,146 170,164 174,164" fill="url(#tm-facet-d)" opacity="0.7"/>
    <polygon points="226,142 230,146 230,164 226,164" fill="url(#tm-facet-d)" opacity="0.7"/>
    <!-- Tall-rectangle ornate silver engraved cap -->
    <rect x="162" y="76" width="76" height="68" rx="2" fill="url(#tm-cap)" stroke="#c8c8c4" stroke-width="0.6"/>
    <!-- Engraved decoration panel -->
    <rect x="168" y="82" width="64" height="58" rx="1" fill="url(#tm-cap-eng)" opacity="0.8"/>
    <!-- Engraved vertical lines to simulate ornate engraving -->
    <line x1="176" y1="84" x2="176" y2="138" stroke="#888880" stroke-width="0.5" opacity="0.4"/>
    <line x1="184" y1="84" x2="184" y2="138" stroke="#888880" stroke-width="0.5" opacity="0.4"/>
    <line x1="200" y1="84" x2="200" y2="138" stroke="#888880" stroke-width="0.6" opacity="0.5"/>
    <line x1="216" y1="84" x2="216" y2="138" stroke="#888880" stroke-width="0.5" opacity="0.4"/>
    <line x1="224" y1="84" x2="224" y2="138" stroke="#888880" stroke-width="0.5" opacity="0.4"/>
    <!-- Horizontal engraving bands -->
    <line x1="170" y1="96" x2="230" y2="96" stroke="#a0a09c" stroke-width="0.5" opacity="0.5"/>
    <line x1="170" y1="110" x2="230" y2="110" stroke="#a0a09c" stroke-width="0.5" opacity="0.5"/>
    <line x1="170" y1="124" x2="230" y2="124" stroke="#a0a09c" stroke-width="0.5" opacity="0.5"/>
    <!-- Engraved logo text -->
    <text x="200" y="107" font-family="Georgia,serif" font-size="5.5" fill="#686868" text-anchor="middle" letter-spacing="1.5" opacity="0.75">IBRAHIM</text>
    <text x="200" y="118" font-family="Georgia,serif" font-size="5.5" fill="#686868" text-anchor="middle" letter-spacing="1" opacity="0.75">AL QURASHI</text>
    <!-- Cap top chrome -->
    <rect x="162" y="76" width="76" height="8" rx="2" fill="#f8f8f6"/>
    <!-- Cap left highlight -->
    <rect x="166" y="84" width="8" height="58" rx="2" fill="#ffffff" opacity="0.22"/>
    <!-- Cap bottom ring -->
    <rect x="162" y="138" width="76" height="6" rx="1" fill="#909090"/>
    <ellipse cx="200" cy="435" rx="52" ry="4" fill="#180800" opacity="0.1"/>
  </g>
</svg>
