<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 500" width="400" height="500">
  <defs>
    <linearGradient id="fm-glass" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#a08060" stop-opacity="0.22"/>
      <stop offset="30%" stop-color="#c8a880" stop-opacity="0.13"/>
      <stop offset="68%" stop-color="#a08060" stop-opacity="0.17"/>
      <stop offset="100%" stop-color="#806040" stop-opacity="0.26"/>
    </linearGradient>
    <!-- Warm coffee brown liquid (Mocha) -->
    <linearGradient id="fm-liquid" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#8a4820"/>
      <stop offset="50%" stop-color="#6a3010"/>
      <stop offset="100%" stop-color="#401808"/>
    </linearGradient>
    <linearGradient id="fm-spray" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2a2a2a"/>
      <stop offset="100%" stop-color="#080808"/>
    </linearGradient>
    <linearGradient id="fm-hl" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#d8a860" stop-opacity="0.42"/>
      <stop offset="100%" stop-color="#d8a860" stop-opacity="0"/>
    </linearGradient>
    <filter id="fm-sh"><feDropShadow dx="0" dy="10" stdDeviation="10" flood-color="#200c04" flood-opacity="0.35"/></filter>
  </defs>
  <g filter="url(#fm-sh)">
    <rect x="186" y="120" width="28" height="290" rx="14" fill="url(#fm-glass)" stroke="#c08840" stroke-width="0.8"/>
    <clipPath id="fm-cl"><rect x="189" y="123" width="22" height="284" rx="11"/></clipPath>
    <rect x="189" y="134" width="22" height="273" fill="url(#fm-liquid)" clip-path="url(#fm-cl)" opacity="0.82"/>
    <rect x="188" y="123" width="8" height="284" fill="url(#fm-hl)" opacity="0.5"/>
    <rect x="190" y="150" width="2.5" height="120" rx="1.25" fill="#f8c880" opacity="0.20"/>
    <text transform="rotate(-90,200,280)" x="200" y="284" font-family="Arial,sans-serif" font-size="5.5" fill="#f0d0a0" text-anchor="middle" letter-spacing="1.5" opacity="0.65">Faunwalk</text>
    <text transform="rotate(-90,200,320)" x="200" y="324" font-family="Arial,sans-serif" font-size="5" fill="#f0d0a0" text-anchor="middle" letter-spacing="1" opacity="0.55">Mocha</text>
    <ellipse cx="200" cy="411" rx="16" ry="4" fill="#200c04" opacity="0.2"/>
    <rect x="183" y="98" width="34" height="24" rx="3" fill="url(#fm-spray)"/>
    <rect x="195" y="88" width="10" height="12" rx="2" fill="url(#fm-spray)"/>
    <rect x="186" y="100" width="8" height="6" rx="2" fill="#484848" opacity="0.6"/>
    <rect x="186" y="100" width="6" height="4" rx="1" fill="#ffffff" opacity="0.08"/>
  </g>
</svg>
