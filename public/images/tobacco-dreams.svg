<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 500" fill="none">
  <defs>
    <!-- Bottle glass gradient -->
    <linearGradient id="glassGrad" x1="0" y1="0" x2="1" y2="0.6">
      <stop offset="0%" stop-color="#f0e8d8" stop-opacity="0.55"/>
      <stop offset="50%" stop-color="#e0d4c0" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#d4c4a8" stop-opacity="0.5"/>
    </linearGradient>
    <!-- Deep amber liquid gradient -->
    <linearGradient id="liquidGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#d4a020" stop-opacity="0.75"/>
      <stop offset="25%" stop-color="#B8860B"/>
      <stop offset="55%" stop-color="#8a6408"/>
      <stop offset="100%" stop-color="#5a4005"/>
    </linearGradient>
    <!-- Glass highlight -->
    <linearGradient id="highlightGrad" x1="0" y1="0" x2="1" y2="0.5">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <!-- Dark bronze cap gradient -->
    <linearGradient id="capGrad" x1="0" y1="0" x2="0.8" y2="1">
      <stop offset="0%" stop-color="#a08050"/>
      <stop offset="25%" stop-color="#7a6040"/>
      <stop offset="50%" stop-color="#907050"/>
      <stop offset="75%" stop-color="#685030"/>
      <stop offset="100%" stop-color="#7a6040"/>
    </linearGradient>
    <!-- Cap ornate detail gradient -->
    <linearGradient id="ornateGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#b8985c"/>
      <stop offset="50%" stop-color="#8a7040"/>
      <stop offset="100%" stop-color="#6a5030"/>
    </linearGradient>
    <!-- Drop shadow filter -->
    <filter id="shadow" x="-10%" y="-5%" width="120%" height="115%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="9" result="blur"/>
      <feOffset in="blur" dx="0" dy="7" result="offsetBlur"/>
      <feFlood flood-color="#000000" flood-opacity="0.16" result="color"/>
      <feComposite in="color" in2="offsetBlur" operator="in" result="shadow"/>
      <feMerge>
        <feMergeNode in="shadow"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <!-- Reflection -->
    <radialGradient id="reflectionGrad" cx="0.28" cy="0.35" r="0.45">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.28"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Shadow beneath bottle -->
  <ellipse cx="200" cy="462" rx="95" ry="13" fill="#000" opacity="0.12"/>

  <g filter="url(#shadow)">
    <!-- Wide-shouldered bottle tapering down -->
    <path d="
      M 110 165
      Q 105 175 105 200
      L 120 435
      Q 122 450 140 450
      L 260 450
      Q 278 450 280 435
      L 295 200
      Q 295 175 290 165
      Z
    " fill="url(#glassGrad)" stroke="#d0c0a0" stroke-width="1"/>

    <!-- Liquid fill -->
    <path d="
      M 108 215
      L 122 435
      Q 124 448 140 448
      L 260 448
      Q 276 448 278 435
      L 292 215
      Z
    " fill="url(#liquidGrad)"/>

    <!-- Glass highlight strip -->
    <path d="
      M 120 175
      L 118 185
      L 128 400
      L 138 400
      L 133 185
      L 130 175
      Z
    " fill="url(#highlightGrad)"/>

    <!-- Large reflection -->
    <ellipse cx="150" cy="310" rx="22" ry="90" fill="url(#reflectionGrad)" transform="rotate(-4 150 310)"/>

    <!-- Bottle neck -->
    <path d="
      M 175 110
      L 175 165
      L 225 165
      L 225 110
      Q 223 105 220 105
      L 180 105
      Q 177 105 175 110
      Z
    " fill="url(#glassGrad)" stroke="#d0c0a0" stroke-width="1"/>

    <!-- Neck highlight -->
    <rect x="180" y="112" width="5" height="50" rx="2.5" fill="#ffffff" opacity="0.2"/>

    <!-- Dark bronze ornate cap - taller and decorative -->
    <path d="
      M 165 40
      L 165 105
      L 235 105
      L 235 40
      Q 235 32 228 32
      L 172 32
      Q 165 32 165 40
      Z
    " fill="url(#capGrad)" stroke="#605030" stroke-width="0.8"/>

    <!-- Cap decorative bands -->
    <rect x="165" y="50" width="70" height="2.5" rx="1" fill="#b8985c" opacity="0.6"/>
    <rect x="165" y="65" width="70" height="2.5" rx="1" fill="#b8985c" opacity="0.5"/>
    <rect x="165" y="80" width="70" height="2.5" rx="1" fill="#b8985c" opacity="0.4"/>
    <rect x="165" y="95" width="70" height="2.5" rx="1" fill="#b8985c" opacity="0.5"/>

    <!-- Cap highlight -->
    <rect x="172" y="36" width="5" height="65" rx="2.5" fill="#ffffff" opacity="0.2"/>

    <!-- Cap top crown detail -->
    <rect x="165" y="32" width="70" height="4" rx="2" fill="#a08050" opacity="0.7"/>

    <!-- Small decorative diamond on cap -->
    <path d="M 200 42 L 206 50 L 200 58 L 194 50 Z" fill="url(#ornateGrad)" stroke="#a08050" stroke-width="0.5"/>
  </g>
</svg>