<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 500" width="400" height="500">
  <defs>
    <!-- Fully opaque deep violet-blue body -->
    <linearGradient id="dr-body" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#1a1050" stop-opacity="1"/>
      <stop offset="30%" stop-color="#2a1870" stop-opacity="1"/>
      <stop offset="68%" stop-color="#201460" stop-opacity="1"/>
      <stop offset="100%" stop-color="#100c40" stop-opacity="1"/>
    </linearGradient>
    <!-- Matching violet ribbed cap -->
    <linearGradient id="dr-cap" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2a1870"/>
      <stop offset="100%" stop-color="#100c40"/>
    </linearGradient>
    <linearGradient id="dr-hl" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#8060d0" stop-opacity="0.30"/>
      <stop offset="100%" stop-color="#8060d0" stop-opacity="0"/>
    </linearGradient>
    <filter id="dr-sh"><feDropShadow dx="0" dy="12" stdDeviation="14" flood-color="#080640" flood-opacity="0.5"/></filter>
  </defs>
  <g filter="url(#dr-sh)">
    <!-- Body 100ml, 112×295, opaque -->
    <rect x="144" y="145" width="112" height="295" rx="3" fill="url(#dr-body)" stroke="#201860" stroke-width="0.8"/>
    <!-- Left edge highlight (subtle) -->
    <rect x="146" y="148" width="20" height="289" fill="url(#dr-hl)" opacity="0.5"/>
    <rect x="149" y="175" width="4" height="115" rx="2" fill="#c0a0ff" opacity="0.12"/>
    <!-- Sniiff Culture brand text -->
    <text x="200" y="248" font-family="'Arial Black','Arial',sans-serif" font-size="11" font-weight="bold" fill="#ffffff" text-anchor="middle" letter-spacing="2" opacity="0.90">Sniiff</text>
    <!-- Product name big -->
    <text x="200" y="272" font-family="'Arial Black','Arial',sans-serif" font-size="14" font-weight="900" fill="#ffffff" text-anchor="middle" letter-spacing="1.5" opacity="0.95">DAILY RIZZ</text>
    <line x1="162" y1="282" x2="238" y2="282" stroke="#ffffff" stroke-width="0.6" opacity="0.3"/>
    <!-- Base -->
    <rect x="142" y="436" width="116" height="5" rx="2" fill="#080640" opacity="0.5"/>
    <!-- Neck -->
    <rect x="167" y="124" width="66" height="23" rx="2" fill="url(#dr-body)" stroke="#201860" stroke-width="0.7"/>
    <!-- Matching violet ribbed cap -->
    <rect x="150" y="72" width="100" height="54" rx="2" fill="url(#dr-cap)"/>
    <!-- Rib lines on cap -->
    <line x1="162" y1="74" x2="162" y2="124" stroke="#ffffff" stroke-width="0.4" opacity="0.10"/>
    <line x1="174" y1="74" x2="174" y2="124" stroke="#ffffff" stroke-width="0.4" opacity="0.10"/>
    <line x1="186" y1="74" x2="186" y2="124" stroke="#ffffff" stroke-width="0.4" opacity="0.10"/>
    <line x1="200" y1="74" x2="200" y2="124" stroke="#ffffff" stroke-width="0.4" opacity="0.10"/>
    <line x1="214" y1="74" x2="214" y2="124" stroke="#ffffff" stroke-width="0.4" opacity="0.10"/>
    <line x1="226" y1="74" x2="226" y2="124" stroke="#ffffff" stroke-width="0.4" opacity="0.10"/>
    <line x1="238" y1="74" x2="238" y2="124" stroke="#ffffff" stroke-width="0.4" opacity="0.10"/>
    <rect x="150" y="72" width="100" height="6" rx="2" fill="#3a2888"/>
    <rect x="150" y="120" width="100" height="6" rx="1" fill="#100c40"/>
    <rect x="153" y="78" width="8" height="42" rx="1" fill="#ffffff" opacity="0.08"/>
    <ellipse cx="200" cy="447" rx="62" ry="5" fill="#080640" opacity="0.1"/>
  </g>
</svg>
