<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 500" width="400" height="500">
  <defs>
    <!-- Fully opaque deep red body -->
    <linearGradient id="ad-body" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#500810" stop-opacity="1"/>
      <stop offset="30%" stop-color="#780c14" stop-opacity="1"/>
      <stop offset="68%" stop-color="#600a12" stop-opacity="1"/>
      <stop offset="100%" stop-color="#380608" stop-opacity="1"/>
    </linearGradient>
    <!-- Matching deep red ribbed cap -->
    <linearGradient id="ad-cap" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#780c14"/>
      <stop offset="100%" stop-color="#380608"/>
    </linearGradient>
    <linearGradient id="ad-hl" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#d06060" stop-opacity="0.30"/>
      <stop offset="100%" stop-color="#d06060" stop-opacity="0"/>
    </linearGradient>
    <filter id="ad-sh"><feDropShadow dx="0" dy="12" stdDeviation="14" flood-color="#200408" flood-opacity="0.5"/></filter>
  </defs>
  <g filter="url(#ad-sh)">
    <!-- Body 100ml, 112×295, opaque deep red -->
    <rect x="144" y="145" width="112" height="295" rx="3" fill="url(#ad-body)" stroke="#500810" stroke-width="0.8"/>
    <rect x="146" y="148" width="20" height="289" fill="url(#ad-hl)" opacity="0.5"/>
    <rect x="149" y="175" width="4" height="115" rx="2" fill="#ff9090" opacity="0.10"/>
    <text x="200" y="248" font-family="'Arial Black','Arial',sans-serif" font-size="11" font-weight="bold" fill="#ffffff" text-anchor="middle" letter-spacing="2" opacity="0.90">Sniiff</text>
    <text x="200" y="268" font-family="'Arial Black','Arial',sans-serif" font-size="11" font-weight="900" fill="#ffffff" text-anchor="middle" letter-spacing="1.5" opacity="0.95">ARABIAN</text>
    <text x="200" y="284" font-family="'Arial Black','Arial',sans-serif" font-size="11" font-weight="900" fill="#ffffff" text-anchor="middle" letter-spacing="1.5" opacity="0.95">DESIRE</text>
    <line x1="162" y1="294" x2="238" y2="294" stroke="#ffffff" stroke-width="0.6" opacity="0.3"/>
    <rect x="142" y="436" width="116" height="5" rx="2" fill="#200408" opacity="0.5"/>
    <rect x="167" y="124" width="66" height="23" rx="2" fill="url(#ad-body)" stroke="#500810" stroke-width="0.7"/>
    <rect x="150" y="72" width="100" height="54" rx="2" fill="url(#ad-cap)"/>
    <line x1="162" y1="74" x2="162" y2="124" stroke="#ffffff" stroke-width="0.4" opacity="0.10"/>
    <line x1="174" y1="74" x2="174" y2="124" stroke="#ffffff" stroke-width="0.4" opacity="0.10"/>
    <line x1="186" y1="74" x2="186" y2="124" stroke="#ffffff" stroke-width="0.4" opacity="0.10"/>
    <line x1="200" y1="74" x2="200" y2="124" stroke="#ffffff" stroke-width="0.4" opacity="0.10"/>
    <line x1="214" y1="74" x2="214" y2="124" stroke="#ffffff" stroke-width="0.4" opacity="0.10"/>
    <line x1="226" y1="74" x2="226" y2="124" stroke="#ffffff" stroke-width="0.4" opacity="0.10"/>
    <line x1="238" y1="74" x2="238" y2="124" stroke="#ffffff" stroke-width="0.4" opacity="0.10"/>
    <rect x="150" y="72" width="100" height="6" rx="2" fill="#901020"/>
    <rect x="150" y="120" width="100" height="6" rx="1" fill="#380608"/>
    <rect x="153" y="78" width="8" height="42" rx="1" fill="#ffffff" opacity="0.08"/>
    <ellipse cx="200" cy="447" rx="62" ry="5" fill="#200408" opacity="0.1"/>
  </g>
