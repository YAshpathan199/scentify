<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 500" width="400" height="500">
  <defs>
    <!-- Dark glass gradient -->
    <linearGradient id="bt-glass" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#2a2a2a" stop-opacity="0.8"/>
      <stop offset="30%" stop-color="#3a3a3a" stop-opacity="0.7"/>
      <stop offset="70%" stop-color="#252525" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#1a1a1a" stop-opacity="0.9"/>
    </linearGradient>
    <!-- Liquid - near black with gold shimmer -->
    <linearGradient id="bt-liquid" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1a1000"/>
      <stop offset="30%" stop-color="#B8860B" stop-opacity="0.3"/>
      <stop offset="50%" stop-color="#1a1000"/>
      <stop offset="70%" stop-color="#B8860B" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#0a0500"/>
    </linearGradient>
    <!-- Gold accent gradient -->
    <linearGradient id="bt-gold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#d4af37"/>
      <stop offset="50%" stop-color="#B8860B"/>
      <stop offset="100%" stop-color="#96700a"/>
    </linearGradient>
    <!-- Cap gradient -->
    <linearGradient id="bt-cap" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#333333"/>
      <stop offset="50%" stop-color="#1a1a1a"/>
      <stop offset="100%" stop-color="#0a0a0a"/>
    </linearGradient>
    <!-- Edge highlight -->
    <linearGradient id="bt-highlight" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <!-- Shadow -->
    <filter id="bt-shadow" x="-20%" y="-10%" width="140%" height="130%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#000000" flood-opacity="0.25"/>
    </filter>
  </defs>

  <g filter="url(#bt-shadow)">
    <!-- Main bottle body - tall slim rectangle with sharp edges -->
    <rect x="150" y="145" width="100" height="290" rx="4" fill="url(#bt-glass)" stroke="#444444" stroke-width="0.8"/>

    <!-- Liquid fill -->
    <clipPath id="bt-clip">
      <rect x="153" y="148" width="94" height="284" rx="3"/>
    </clipPath>
    <rect x="153" y="170" width="94" height="262" fill="url(#bt-liquid)" clip-path="url(#bt-clip)" opacity="0.9"/>

    <!-- Gold shimmer streaks in liquid -->
    <line x1="170" y1="200" x2="175" y2="420" stroke="#B8860B" stroke-width="0.5" opacity="0.15"/>
    <line x1="200" y1="190" x2="198" y2="430" stroke="#d4af37" stroke-width="0.3" opacity="0.1"/>
    <line x1="225" y1="210" x2="228" y2="410" stroke="#B8860B" stroke-width="0.4" opacity="0.12"/>

    <!-- Left edge highlight -->
    <rect x="152" y="148" width="15" height="284" fill="url(#bt-highlight)" opacity="0.5"/>

    <!-- Small bright highlight -->
    <rect x="155" y="180" width="4" height="80" rx="2" fill="#ffffff" opacity="0.15"/>

    <!-- Gold accent line near bottom -->
    <rect x="150" y="415" width="100" height="2" fill="url(#bt-gold)" opacity="0.7"/>

    <!-- Gold accent line near top of body -->
    <rect x="150" y="148" width="100" height="2" fill="url(#bt-gold)" opacity="0.5"/>

    <!-- Neck -->
    <rect x="170" y="120" width="60" height="28" rx="2" fill="url(#bt-glass)" stroke="#444444" stroke-width="0.8"/>

    <!-- Neck gold ring -->
    <rect x="168" y="135" width="64" height="3" fill="url(#bt-gold)" opacity="0.8"/>

    <!-- Cap - tall rectangular, glossy black -->
    <rect x="155" y="40" width="90" height="82" rx="3" fill="url(#bt-cap)" stroke="#333333" stroke-width="0.8"/>

    <!-- Cap top surface -->
    <rect x="155" y="40" width="90" height="10" rx="3" fill="#2a2a2a"/>

    <!-- Cap left highlight -->
    <rect x="158" y="45" width="10" height="72" fill="#ffffff" opacity="0.08"/>

    <!-- Cap small bright line -->
    <rect x="160" y="50" width="3" height="40" rx="1.5" fill="#ffffff" opacity="0.12"/>

    <!-- Cap bottom edge -->
    <rect x="155" y="118" width="90" height="4" rx="1" fill="#333333"/>

    <!-- Bottom base -->
    <rect x="148" y="433" width="104" height="5" rx="2" fill="#333333" opacity="0.6"/>

    <!-- Ground reflection -->
    <ellipse cx="200" cy="445" rx="55" ry="5" fill="#1a1a1a" opacity="0.15"/>
  </g>
</svg>