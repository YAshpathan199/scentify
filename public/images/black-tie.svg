<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 500" width="400" height="500">
  <defs>
    <!-- Clear glass (slightly visible walls) -->
    <linearGradient id="bt-glass" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#a8a8a0" stop-opacity="0.20"/>
      <stop offset="30%" stop-color="#d0d0c8" stop-opacity="0.11"/>
      <stop offset="68%" stop-color="#a8a8a0" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#888880" stop-opacity="0.24"/>
    </linearGradient>
    <!-- Clear/pale straw liquid -->
    <linearGradient id="bt-liquid" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f8f8f0" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#f0edd8" stop-opacity="0.25"/>
    </linearGradient>
    <!-- Gold knurled cap -->
    <linearGradient id="bt-cap" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f0d060"/>
      <stop offset="45%" stop-color="#c89830"/>
      <stop offset="100%" stop-color="#806010"/>
    </linearGradient>
    <linearGradient id="bt-hl" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <!-- Label gradient dark -->
    <linearGradient id="bt-label" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#181818"/>
      <stop offset="100%" stop-color="#0a0a0a"/>
    </linearGradient>
    <filter id="bt-sh"><feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#303030" flood-opacity="0.22"/></filter>
  </defs>
  <g filter="url(#bt-sh)">
    <!-- Curved body with rounded shoulders: 50ml, ~10cm, x:152-248, y:158-428 -->
    <!-- Using path: rounded shoulders, straight sides, rounded base -->
    <path d="M176,180 Q152,180 152,204 L152,425 Q152,428 155,428 L245,428 Q248,428 248,425 L248,204 Q248,180 224,180 Q218,160 200,156 Q182,160 176,180 Z" fill="url(#bt-glass)" stroke="#b0b0a8" stroke-width="0.8"/>
    <clipPath id="bt-cl">
      <path d="M155,205 L155,424 L245,424 L245,205 Q245,183 224,183 Q218,163 200,159 Q182,163 176,183 Z"/>
    </clipPath>
    <!-- Liquid fill -->
    <rect x="156" y="182" width="88" height="244" fill="url(#bt-liquid)" clip-path="url(#bt-cl)"/>
    <!-- Glass edge highlight -->
    <path d="M176,180 Q152,180 152,204 L152,425" fill="none" stroke="url(#bt-hl)" stroke-width="18" opacity="0.42"/>
    <rect x="155" y="210" width="4" height="130" rx="2" fill="#ffffff" opacity="0.22"/>
    <!-- Illustrated paper label: dark panel with party silhouettes -->
    <rect x="156" y="262" width="88" height="100" rx="1" fill="url(#bt-label)" opacity="0.88"/>
    <!-- Silhouette art: stylized people at party (simple shapes) -->
    <!-- Person 1 (left) -->
    <ellipse cx="174" cy="296" rx="5" ry="5" fill="#ffffff" opacity="0.60"/>
    <path d="M170,301 Q169,315 168,322 L180,322 Q179,315 178,301 Z" fill="#ffffff" opacity="0.55"/>
    <!-- Person 2 (center, tall) -->
    <ellipse cx="200" cy="289" rx="5" ry="5" fill="#ffffff" opacity="0.65"/>
    <path d="M196,294 Q195,310 194,322 L206,322 Q205,310 204,294 Z" fill="#ffffff" opacity="0.60"/>
    <!-- Person 3 (right) -->
    <ellipse cx="226" cy="296" rx="5" ry="5" fill="#ffffff" opacity="0.60"/>
    <path d="M222,301 Q221,315 220,322 L232,322 Q231,315 230,301 Z" fill="#ffffff" opacity="0.55"/>
    <!-- Stars -->
    <text x="185" y="288" font-family="Arial" font-size="6" fill="#f0d060" opacity="0.6">★</text>
    <text x="208" y="284" font-family="Arial" font-size="5" fill="#f0d060" opacity="0.6">★</text>
    <!-- Label text -->
    <text x="200" y="345" font-family="Georgia,serif" font-size="10" fill="#f0d060" text-anchor="middle" letter-spacing="1.5" opacity="0.90">Black Tie</text>
    <text x="200" y="356" font-family="Arial,sans-serif" font-size="5.5" fill="#c0a040" text-anchor="middle" letter-spacing="2.5" opacity="0.75">ARTISCENTS</text>
    <!-- Base -->
    <rect x="150" y="424" width="100" height="4" rx="2" fill="#484840" opacity="0.35"/>
    <!-- Neck -->
    <rect x="174" y="136" width="52" height="26" rx="4" fill="url(#bt-glass)" stroke="#b0b0a8" stroke-width="0.7"/>
    <!-- Tall round gold knurled cap -->
    <rect x="171" y="78" width="58" height="62" rx="4" fill="url(#bt-cap)"/>
    <!-- Knurl texture lines -->
    <line x1="180" y1="80" x2="180" y2="138" stroke="#c89020" stroke-width="0.5" opacity="0.5"/>
    <line x1="188" y1="80" x2="188" y2="138" stroke="#c89020" stroke-width="0.5" opacity="0.5"/>
    <line x1="196" y1="80" x2="196" y2="138" stroke="#c89020" stroke-width="0.5" opacity="0.5"/>
    <line x1="204" y1="80" x2="204" y2="138" stroke="#c89020" stroke-width="0.5" opacity="0.5"/>
    <line x1="212" y1="80" x2="212" y2="138" stroke="#c89020" stroke-width="0.5" opacity="0.5"/>
    <line x1="220" y1="80" x2="220" y2="138" stroke="#c89020" stroke-width="0.5" opacity="0.5"/>
    <!-- Cap top -->
    <ellipse cx="200" cy="78" rx="29" ry="9" fill="#f0d868"/>
    <!-- Cap top highlight -->
    <ellipse cx="190" cy="75" rx="11" ry="4" fill="#ffffff" opacity="0.22"/>
    <!-- Cap bottom ring -->
    <rect x="171" y="134" width="58" height="6" rx="2" fill="#a07818"/>
    <!-- Left highlight on cap -->
    <rect x="175" y="82" width="6" height="54" rx="3" fill="#ffffff" opacity="0.18"/>
    <ellipse cx="200" cy="434" rx="52" ry="4" fill="#303030" opacity="0.1"/>
  </g>
</svg>
