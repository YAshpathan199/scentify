    <rect x="168" y="295" width="64" height="1.5" fill="url(#roy-gold)" opacity="0.3"/>
    <rect x="180" y="140" width="40" height="22" rx="3" fill="url(#roy-glass)" stroke="#6a2070" stroke-width="0.7"/>
