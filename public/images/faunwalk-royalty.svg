    <rect x="195" y="128" width="10" height="14" rx="2" fill="#401060"/>
    <rect x="197" y="122" width="6" height="8" rx="1" fill="#380858"/>
    <rect x="162" y="52" width="76" height="90" rx="8" fill="url(#roy-cap)" stroke="#401060" stroke-width="0.8"/>
    <rect x="162" y="52" width="76" height="14" rx="8" fill="#381050"/>
