<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 500" width="400" height="500">
  <defs>
    <linearGradient id="roy-glass" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#2a1040" stop-opacity="0.5"/>
      <stop offset="40%" stop-color="#3a1850" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#180828" stop-opacity="0.55"/>
    </linearGradient>
    <linearGradient id="roy-liquid" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#8a3080"/>
      <stop offset="30%" stop-color="#601858"/>
      <stop offset="65%" stop-color="#400838"/>
      <stop offset="100%" stop-color="#200018"/>
    </linearGradient>
    <linearGradient id="roy-cap" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2a1040"/>
      <stop offset="50%" stop-color="#180828"/>
      <stop offset="100%" stop-color="#080010"/>
    </linearGradient>
    <linearGradient id="roy-gold" x1="0" y1="0" x2="0" y2="1">
