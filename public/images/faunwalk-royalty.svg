    <rect x="171" y="178" width="58" height="239" fill="url(#roy-liquid)" clip-path="url(#roy-clip)" opacity="0.92"/>
    <ellipse cx="192" cy="220" rx="11" ry="22" fill="#c060a8" fill-opacity="0.12" clip-path="url(#roy-clip)"/>
    <line x1="178" y1="200" x2="180" y2="410" stroke="#e8d090" stroke-width="0.5" opacity="0.1"/>
    <line x1="208" y1="210" x2="210" y2="400" stroke="#c8a850" stroke-width="0.4" opacity="0.08"/>
