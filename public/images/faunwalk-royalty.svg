    <text x="200" y="85" font-size="14" text-anchor="middle" fill="#c8a850" opacity="0.6">♛</text>
    <text x="200" y="104" font-family="Georgia, serif" font-size="6" font-weight="bold" fill="#c8a850" text-anchor="middle" letter-spacing="1.2">FAUNWALK</text>
    <rect x="162" y="138" width="76" height="4" rx="2" fill="url(#roy-gold)"/>
    <rect x="166" y="418" width="68" height="4" rx="2" fill="#401060" opacity="0.4"/>
