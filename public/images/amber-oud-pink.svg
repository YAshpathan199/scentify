<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 200" fill="none">
  <defs>
    <linearGradient id="bottleGrad" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0%" stop-color="#8B3252"/>
      <stop offset="45%" stop-color="#C4607A"/>
      <stop offset="100%" stop-color="#E8A0B0"/>
    </linearGradient>
    <linearGradient id="capGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#C8A060"/>
      <stop offset="100%" stop-color="#8B6830"/>
    </linearGradient>
    <linearGradient id="shine" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="white" stop-opacity="0.25"/>
      <stop offset="40%" stop-color="white" stop-opacity="0.07"/>
      <stop offset="100%" stop-color="white" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <!-- Cap - hexagonal/ornate -->
  <polygon points="60,8 76,16 76,30 60,38 44,30 44,16" fill="url(#capGrad)"/>
  <circle cx="60" cy="23" r="6" fill="#D4AF50" fill-opacity="0.6"/>
  <!-- Neck -->
  <rect x="51" y="38" width="18" height="16" rx="2" fill="#A07840"/>
  <!-- Body -->
  <rect x="20" y="54" width="80" height="114" rx="16" fill="url(#bottleGrad)"/>
  <rect x="20" y="54" width="80" height="114" rx="16" fill="url(#shine)"/>
  <!-- Gold border -->
  <rect x="20" y="54" width="80" height="114" rx="16" fill="none" stroke="#C8A060" stroke-width="1.5" stroke-opacity="0.5"/>
  <!-- Label -->
  <rect x="30" y="82" width="60" height="54" rx="8" fill="black" fill-opacity="0.15"/>
  <rect x="38" y="93" width="44" height="4" rx="2" fill="white" fill-opacity="0.8"/>
  <rect x="42" y="103" width="36" height="3" rx="1.5" fill="white" fill-opacity="0.55"/>
  <rect x="38" y="112" width="44" height="3" rx="1.5" fill="white" fill-opacity="0.4"/>
  <!-- Oud amber crescent accent -->
  <path d="M50 140 Q60 134 70 140" stroke="white" stroke-width="1.5" stroke-opacity="0.4" fill="none"/>
</svg>
