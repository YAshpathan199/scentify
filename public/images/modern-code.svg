    <filter id="mc-sh"><feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#303030" flood-opacity="0.22"/></filter>
  </defs>
  <g filter="url(#mc-sh)">
    <path d="M176,180 Q152,180 152,204 L152,425 Q152,428 155,428 L245,428 Q248,428 248,425 L248,204 Q248,180 224,180 Q218,160 200,156 Q182,160 176,180 Z" fill="url(#mc-glass)" stroke="#b0b0a8" stroke-width="0.8"/>
    <clipPath id="mc-cl">
