<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 500" width="400" height="500">
  <defs>
    <!-- Dark amber to gold gradient glass (tinted, 30ml tapered) -->
    <linearGradient id="on-glass" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#5a2800" stop-opacity="0.95"/>
      <stop offset="30%" stop-color="#8c4810" stop-opacity="0.80"/>
      <stop offset="68%" stop-color="#6a3408" stop-opacity="0.90"/>
      <stop offset="100%" stop-color="#3c1800" stop-opacity="0.98"/>
    </linearGradient>
    <linearGradient id="on-glass-vert" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#c87830" stop-opacity="0.90"/>
      <stop offset="50%" stop-color="#8c4810" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#5a2800" stop-opacity="0.95"/>
    </linearGradient>
    <linearGradient id="on-liquid" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#d09040"/>
      <stop offset="50%" stop-color="#a06020"/>
      <stop offset="100%" stop-color="#6a3808"/>
    </linearGradient>
    <!-- Gold dome cap -->
    <radialGradient id="on-cap-dome" cx="40%" cy="30%" r="65%">
      <stop offset="0%" stop-color="#f0d060"/>
      <stop offset="45%" stop-color="#c89830"/>
      <stop offset="100%" stop-color="#806010"/>
    </radialGradient>
    <linearGradient id="on-hl" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#f0a850" stop-opacity="0.40"/>
      <stop offset="100%" stop-color="#f0a850" stop-opacity="0"/>
    </linearGradient>
    <filter id="on-sh"><feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#2c0e00" flood-opacity="0.45"/></filter>
  </defs>
  <g filter="url(#on-sh)">
    <!-- Tapered bottle body: wider at shoulders, slight taper toward base -->
    <!-- Rounded shoulders path: 30ml, short ~8cm, x:164-236, y:185-417 -->
    <path d="M172,220 Q164,220 164,230 L164,415 Q164,418 167,418 L233,418 Q236,418 236,415 L236,230 Q236,220 228,220 Q220,194 200,190 Q180,194 172,220 Z" fill="url(#on-glass)" stroke="#7a3808" stroke-width="0.8"/>
    <!-- Liquid fill (clipped to body, slightly inset) -->
    <clipPath id="on-cl">
      <path d="M166,222 Q166,224 166,230 L166,414 L234,414 L234,230 Q234,224 234,222 Q220,196 200,192 Q180,196 166,222 Z"/>
    </clipPath>
    <rect x="167" y="200" width="66" height="216" fill="url(#on-liquid)" clip-path="url(#on-cl)" opacity="0.82"/>
    <!-- Left edge highlight -->
    <path d="M172,220 Q164,220 164,230 L164,415" fill="none" stroke="url(#on-hl)" stroke-width="14" opacity="0.4"/>
    <!-- Gold text -->
    <text x="200" y="315" font-family="Georgia,serif" font-size="9" fill="#d8a040" text-anchor="middle" letter-spacing="1" opacity="0.85">Oud Nirvana</text>
    <text x="200" y="329" font-family="Arial,sans-serif" font-size="6" fill="#b08030" text-anchor="middle" letter-spacing="2" opacity="0.6">AJMAL</text>
    <!-- Neck cylinder -->
    <rect x="183" y="168" width="34" height="24" rx="2" fill="url(#on-glass)" stroke="#7a3808" stroke-width="0.7"/>
    <!-- Gold ribbed dome cap -->
    <ellipse cx="200" cy="150" rx="30" ry="22" fill="url(#on-cap-dome)" stroke="#c09020" stroke-width="0.8"/>
    <!-- Dome ribs -->
    <line x1="184" y1="138" x2="184" y2="171" stroke="#a07820" stroke-width="0.6" opacity="0.5"/>
    <line x1="191" y1="132" x2="191" y2="171" stroke="#a07820" stroke-width="0.6" opacity="0.5"/>
    <line x1="200" y1="130" x2="200" y2="171" stroke="#a07820" stroke-width="0.6" opacity="0.5"/>
    <line x1="209" y1="132" x2="209" y2="171" stroke="#a07820" stroke-width="0.6" opacity="0.5"/>
    <line x1="216" y1="138" x2="216" y2="171" stroke="#a07820" stroke-width="0.6" opacity="0.5"/>
    <!-- Dome highlight -->
    <ellipse cx="192" cy="143" rx="10" ry="7" fill="#f8e890" opacity="0.25"/>
    <!-- Base shadow -->
    <rect x="162" y="413" width="76" height="5" rx="2" fill="#280c00" opacity="0.4"/>
    <ellipse cx="200" cy="427" rx="42" ry="4" fill="#2c0e00" opacity="0.1"/>
  </g>
</svg>
