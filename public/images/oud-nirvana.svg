<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 500" fill="none">
  <defs>
    <!-- Bottle glass gradient -->
    <linearGradient id="glassGrad" x1="0" y1="0" x2="1" y2="0.6">
      <stop offset="0%" stop-color="#f2ead8" stop-opacity="0.55"/>
      <stop offset="50%" stop-color="#e4d8c0" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#d8c8a8" stop-opacity="0.5"/>
    </linearGradient>
    <!-- Deep gold/amber liquid with darker bottom -->
    <linearGradient id="liquidGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#d4a020" stop-opacity="0.8"/>
      <stop offset="20%" stop-color="#B8860B"/>
      <stop offset="50%" stop-color="#906808"/>
      <stop offset="80%" stop-color="#604505"/>
      <stop offset="100%" stop-color="#3a2a03"/>
    </linearGradient>
    <!-- Glass highlight -->
    <linearGradient id="highlightGrad" x1="0" y1="0" x2="1" y2="0.5">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <!-- Elaborate gold cap gradient -->
    <linearGradient id="capGrad" x1="0" y1="0" x2="0.7" y2="1">
      <stop offset="0%" stop-color="#e8d080"/>
      <stop offset="20%" stop-color="#d4a840"/>
      <stop offset="40%" stop-color="#e0c060"/>
      <stop offset="60%" stop-color="#c09030"/>
      <stop offset="80%" stop-color="#d4b050"/>
      <stop offset="100%" stop-color="#b88828"/>
    </linearGradient>
    <!-- Finial gradient -->
    <linearGradient id="finialGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e8d888"/>
      <stop offset="50%" stop-color="#c8a840"/>
      <stop offset="100%" stop-color="#a88830"/>
    </linearGradient>
    <!-- Arabian curve accent -->
    <radialGradient id="accentGrad" cx="0.5" cy="0.4" r="0.5">
      <stop offset="0%" stop-color="#d4a020" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#B8860B" stop-opacity="0.05"/>
    </radialGradient>
    <!-- Drop shadow filter -->
    <filter id="shadow" x="-10%" y="-5%" width="120%" height="115%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="9" result="blur"/>
      <feOffset in="blur" dx="0" dy="7" result="offsetBlur"/>
      <feFlood flood-color="#000000" flood-opacity="0.16" result="color"/>
      <feComposite in="color" in2="offsetBlur" operator="in" result="shadow"/>
      <feMerge>
        <feMergeNode in="shadow"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <!-- Reflection -->
    <radialGradient id="reflectionGrad" cx="0.28" cy="0.35" r="0.45">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <!-- Inner glow for exotic feel -->
    <radialGradient id="innerGlow" cx="0.5" cy="0.45" r="0.5">
      <stop offset="0%" stop-color="#e8c040" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#B8860B" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Shadow beneath bottle -->
  <ellipse cx="200" cy="465" rx="100" ry="14" fill="#000" opacity="0.12"/>

  <g filter="url(#shadow)">
    <!-- Ornate wider bottle with Arabian-inspired curved silhouette -->
    <path d="
      M 165 135
      Q 120 160 105 210
      Q 90 265 95 320
      Q 100 380 110 420
      Q 115 445 140 450
      L 260 450
      Q 285 445 290 420
      Q 300 380 305 320
      Q 310 265 295 210
      Q 280 160 235 135
      Z
    " fill="url(#glassGrad)" stroke="#d0c0a0" stroke-width="1"/>

    <!-- Liquid fill -->
    <path d="
      M 140 200
      Q 98 255 100 320
      Q 104 380 112 420
      Q 117 443 140 448
      L 260 448
      Q 283 443 288 420
      Q 296 380 300 320
      Q 302 255 260 200
      Z
    " fill="url(#liquidGrad)"/>

    <!-- Inner glow -->
    <ellipse cx="200" cy="330" rx="85" ry="100" fill="url(#innerGlow)"/>

    <!-- Decorative curved accent lines on bottle -->
    <path d="
      M 130 250 Q 200 235 270 250
    " fill="none" stroke="#d4a020" stroke-width="0.6" opacity="0.3"/>
    <path d="
      M 120 300 Q 200 285 280 300
    " fill="none" stroke="#d4a020" stroke-width="0.6" opacity="0.25"/>
    <path d="
      M 118 350 Q 200 335 282 350
    " fill="none" stroke="#d4a020" stroke-width="0.6" opacity="0.2"/>

    <!-- Glass highlight strip -->
    <path d="
      M 145 165
      Q 128 195 118 250
      L 112 340
      L 124 340
      L 130 250
      Q 138 195 152 165
      Z
    " fill="url(#highlightGrad)"/>

    <!-- Large reflection -->
    <ellipse cx="148" cy="300" rx="20" ry="80" fill="url(#reflectionGrad)" transform="rotate(-6 148 300)"/>

    <!-- Bottle neck -->
    <path d="
      M 180 95
      L 180 135
      L 220 135
      L 220 95
      Q 218 90 215 90
      L 185 90
      Q 182 90 180 95
      Z
    " fill="url(#glassGrad)" stroke="#d0c0a0" stroke-width="1"/>

    <!-- Neck highlight -->
    <rect x="185" y="98" width="4" height="34" rx="2" fill="#ffffff" opacity="0.22"/>

    <!-- Elaborate gold cap base -->
    <path d="
      M 168 55
      L 168 92
      L 232 92
      L 232 55
      Q 232 48 225 48
      L 175 48
      Q 168 48 168 55
      Z
    " fill="url(#capGrad)" stroke="#a88828" stroke-width="0.8"/>

    <!-- Cap decorative band -->
    <rect x="168" y="60" width="64" height="2.5" rx="1" fill="#e8d080" opacity="0.6"/>
    <rect x="168" y="72" width="64" height="2.5" rx="1" fill="#e8d080" opacity="0.5"/>
    <rect x="168" y="84" width="64" height="2.5" rx="1" fill="#e8d080" opacity="0.5"/>

    <!-- Cap highlight -->
    <rect x="175" y="52" width="4" height="36" rx="2" fill="#ffffff" opacity="0.22"/>

    <!-- Decorative finial/point on top -->
    <path d="
      M 192 48
      L 192 30
      Q 192 22 200 10
      Q 208 22 208 30
      L 208 48
      Z
    " fill="url(#finialGrad)" stroke="#a88828" stroke-width="0.8"/>

    <!-- Finial highlight -->
    <path d="
      M 196 45 L 196 28 Q 198 18 200 14 L 199 45 Z
    " fill="#ffffff" opacity="0.2"/>

    <!-- Small decorative ball at tip of finial -->
    <circle cx="200" cy="10" r="4" fill="url(#finialGrad)" stroke="#a88828" stroke-width="0.6"/>
    <circle cx="198" cy="8" r="1.5" fill="#ffffff" opacity="0.25"/>
  </g>
</svg>